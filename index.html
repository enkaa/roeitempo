<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roeitempo</title>
<style>
  :root {
    --bg: #0b0d10;
    --raise: #171b20;
    --line: #23292f;
    --text: #f2f4f6;
    --muted: #7d8793;
    --ok: #30d158;
    --slow: #ff9f0a;
    --fast: #ff453a;
    --idle: #4a525c;
    --blue: #0a84ff;
    --state: var(--idle);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  body { display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; padding: 0; border: 0; background: none; }
  .num { font-variant-numeric: tabular-nums; }

  /* Ronde knopjes (geluid, opnieuw, bluetooth) */
  .ib { flex: none; width: var(--ib, 34px); height: var(--ib, 34px); border-radius: 50%;
    background: var(--raise); color: var(--muted); display: grid; place-items: center; position: relative; }
  .ib svg { width: 54%; height: 54%; }
  .ib:active, .pm:active { filter: brightness(1.4); }
  .ib.on { color: var(--ok); background: rgba(48, 209, 88, .14); }
  .ib.bt.cta { color: #fff; background: var(--blue); }
  .ib.bt.connected { color: var(--blue); }
  .ib.bt.busy { color: var(--slow); }
  .ib.bt .dot { position: absolute; right: 3%; top: 3%; width: 26%; height: 26%; border-radius: 50%;
    background: var(--ok); border: 2px solid var(--bg); display: none; }
  .ib.bt.connected .dot { display: block; }
  .chip { flex: none; height: var(--ib, 34px); padding: 0 .9em; border-radius: 999px; background: var(--raise);
    color: var(--muted); font-size: .8em; font-weight: 600; letter-spacing: .02em; }
  .chip.on { color: var(--ok); background: rgba(48, 209, 88, .14); }

  /* ====== Kaart (standaard) ====== */
  .card { flex: 1; display: grid; min-width: 0; min-height: 0;
    padding: max(10px, 3vmin); gap: max(6px, 2vmin);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "top" "gauge" "target" "stats";
    font-size: clamp(12px, 4.4vmin, 18px); --ib: clamp(30px, 10.5vmin, 44px); }
  @media (min-aspect-ratio: 7/5) {
    .card { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "top top" "gauge target" "gauge stats"; }
    .card .target { align-self: end; }
  }
  /* Linksboven vrijlaten voor de vensterknopjes van iPadOS */
  .card .top { grid-area: top; display: flex; justify-content: flex-end; align-items: center; gap: max(6px, 1.6vmin); }

  .gauge { grid-area: gauge; position: relative; min-height: 0; min-width: 0; }
  .gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  .track { fill: none; stroke: var(--line); stroke-linecap: round; }
  .fill { fill: none; stroke: var(--state); stroke-linecap: round; transition: stroke .4s; }
  .zone { fill: none; stroke: var(--ok); stroke-linecap: round; opacity: .9; }
  .tick { stroke: var(--text); stroke-linecap: round; }
  .needle { fill: var(--state); stroke: var(--bg); transition: fill .4s; }
  .spm { fill: var(--text); font-weight: 700; letter-spacing: -.02em; }
  .unit { fill: var(--muted); font-weight: 600; letter-spacing: .12em; }
  .state { fill: var(--state); font-weight: 600; transition: fill .4s; }

  .target { grid-area: target; display: flex; align-items: center; justify-content: center; gap: max(10px, 4vmin); }
  .pm { width: clamp(40px, 13vmin, 64px); height: clamp(40px, 13vmin, 64px); border-radius: 50%;
    background: var(--raise); display: grid; place-items: center; }
  .pm svg { width: 38%; height: 38%; }
  .goal { text-align: center; min-width: 3.2em; }
  .goal .v { font-size: 1.9em; font-weight: 700; line-height: 1; }
  .goal .k, .stat .k { font-size: .62em; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-top: .35em; font-weight: 600; }

  .stats { grid-area: stats; display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line); padding-top: max(6px, 2vmin); }
  .stat { text-align: center; min-width: 0; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .v { font-size: 1.45em; font-weight: 650; line-height: 1.1; white-space: nowrap; }

  /* ====== Smalle balk (breed en laag venster, zoals de mockup) ====== */
  .bar { display: none; }
  @media (max-height: 300px) and (min-aspect-ratio: 2/1) {
    .card { display: none; }
    .bar { flex: 1; display: flex; align-items: center; min-width: 0;
      gap: clamp(8px, 7vh, 18px); padding: 0 clamp(12px, 8vh, 24px);
      font-size: clamp(12px, min(15vh, 3.3vw), 22px); --ib: clamp(30px, min(34vh, 7.2vw), 44px); }
  }
  .hbar { flex: 1 1 60px; min-width: 40px; position: relative; height: .5em; border-radius: 999px; background: var(--line); }
  .hzone { position: absolute; top: -.3em; height: .2em; border-radius: 999px; background: var(--ok); }
  .hfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--state); transition: background .4s, width .4s; }
  .hgoal { position: absolute; top: -.35em; bottom: -.35em; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--text); }
  .hspm { flex: none; display: flex; align-items: baseline; gap: .25em; white-space: nowrap; }
  .hspm b { font-size: 1.75em; font-weight: 700; color: var(--state); transition: color .4s; }
  .hspm .g { font-size: 1.75em; font-weight: 700; }
  .hspm .sl { font-size: 1.2em; color: var(--muted); font-weight: 600; }
  .hspm small { font-size: .62em; color: var(--muted); font-weight: 600; letter-spacing: .1em; margin-left: .2em; }
  .hpm { flex: none; display: flex; gap: .4em; }
  .hpm .pm { width: var(--ib); height: var(--ib); }
  .hmeta { flex: none; text-align: right; line-height: 1.25; white-space: nowrap; }
  .hmeta .d { font-weight: 650; }
  .hmeta .t { color: var(--muted); font-size: .85em; }
  @media (max-height: 300px) and (min-aspect-ratio: 2/1) and (max-width: 480px) {
    .hpm { display: none; }    /* heel smal: alleen kijken, doel instellen in het grotere venster */
  }

  .hint { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); background: #2a3037; color: var(--text);
    font-size: 13px; padding: 8px 14px; border-radius: 10px; max-width: 92vw; text-align: center; width: max-content;
    opacity: 0; pointer-events: none; transition: opacity .3s; }
  .hint.show { opacity: 1; }
</style>
</head>
<body>

<!-- Pictogrammen -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></symbol>
    <symbol id="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M16 9.5l5 5"/><path d="M21 9.5l-5 5"/></symbol>
    <symbol id="i-bt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3.5 4v4.5H8"/></symbol>
    <symbol id="i-pip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><rect x="11.5" y="12" width="7" height="4.5" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></symbol>
  </defs>
</svg>

<main class="card">
  <div class="top">
    <button class="chip" data-act="demo" type="button" aria-pressed="false">Demo</button>
    <button class="ib" data-act="pip" type="button" aria-pressed="false" aria-label="Zwevende balk"><svg><use href="#i-pip"/></svg></button>
    <button class="ib" data-act="reset" type="button" aria-label="Afstand en tijd op nul zetten"><svg><use href="#i-reset"/></svg></button>
    <button class="ib" data-act="audio" type="button" aria-pressed="false" aria-label="Metronoom aan of uit"><svg><use href="#i-off"/></svg></button>
    <button class="ib bt cta" data-act="conn" type="button" aria-label="Verbinden met de roeier"><svg><use href="#i-bt"/></svg><span class="dot"></span></button>
  </div>

  <div class="gauge">
    <svg viewBox="0 -6 200 178" aria-hidden="true">
      <path class="track" id="track" stroke-width="11"/>
      <path class="fill" id="fill" stroke-width="11"/>
      <path class="zone" id="zone" stroke-width="4"/>
      <line class="tick" id="goalTick" stroke-width="3"/>
      <circle class="needle" id="needle" r="8" stroke-width="3"/>
      <text class="spm num" data-v="spm" x="100" y="108" text-anchor="middle" font-size="58">--</text>
      <text class="unit" x="100" y="127" text-anchor="middle" font-size="10">SLAGEN / MIN</text>
      <text class="state" data-v="state" x="100" y="160" text-anchor="middle" font-size="14">Niet verbonden</text>
    </svg>
  </div>

  <div class="target">
    <button class="pm" data-act="minus" type="button" aria-label="Doeltempo lager"><svg><use href="#i-minus"/></svg></button>
    <div class="goal"><div class="v num" data-v="goal">24</div><div class="k">Doel</div></div>
    <button class="pm" data-act="plus" type="button" aria-label="Doeltempo hoger"><svg><use href="#i-plus"/></svg></button>
  </div>

  <div class="stats">
    <div class="stat"><div class="v num" data-v="dist">0</div><div class="k">Meter</div></div>
    <div class="stat"><div class="v num" data-v="time">0:00</div><div class="k">Tijd</div></div>
    <div class="stat"><div class="v num" data-v="pace">-:--</div><div class="k">/500 m</div></div>
  </div>
</main>

<div class="bar">
  <button class="ib" data-act="audio" type="button" aria-pressed="false" aria-label="Metronoom aan of uit"><svg><use href="#i-off"/></svg></button>
  <div class="hbar" aria-hidden="true"><div class="hfill" id="hfill"></div><div class="hzone" id="hzone"></div><div class="hgoal" id="hgoal"></div></div>
  <div class="hspm num"><b data-v="spm">--</b><span class="sl">/</span><span class="g" data-v="goal">24</span><small>SPM</small></div>
  <div class="hpm">
    <button class="pm" data-act="minus" type="button" aria-label="Doeltempo lager"><svg><use href="#i-minus"/></svg></button>
    <button class="pm" data-act="plus" type="button" aria-label="Doeltempo hoger"><svg><use href="#i-plus"/></svg></button>
  </div>
  <div class="hmeta num"><div class="d"><span data-v="dist">0</span> m</div><div class="t" data-v="time">0:00</div></div>
  <button class="ib bt cta" data-act="conn" type="button" aria-label="Verbinden met de roeier"><svg><use href="#i-bt"/></svg><span class="dot"></span></button>
</div>

<div class="hint" id="hint"></div>

<!-- Zwevende balk: wordt op dit canvas getekend en als video in Picture-in-Picture gezet -->
<canvas id="pipCanvas" width="840" height="180" style="position:fixed;left:-9999px;top:0"></canvas>
<video id="pipVideo" muted playsinline autoplay style="position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none"></video>

<script>
(() => {
  'use strict';

  // ---------- Instellingen ----------
  const SPM_MIN = 10, SPM_MAX = 40;   // bereik van de meter
  const GOAL_MIN = 14, GOAL_MAX = 40;
  const TOLERANCE = 2;                // binnen +/- 2 slagen = op tempo
  const IDLE_AFTER_MS = 6000;         // geen nieuwe slag binnen 6 s = stilstand

  const store = {
    get(k, d) { try { const v = localStorage.getItem('roeitempo.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('roeitempo.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const $ = id => document.getElementById(id);
  const all = sel => document.querySelectorAll(sel);
  const setText = (key, text) => all(`[data-v="${key}"]`).forEach(n => { if (n.textContent !== text) n.textContent = text; });
  const el = {
    track: $('track'), zone: $('zone'), fill: $('fill'), goalTick: $('goalTick'), needle: $('needle'),
    hfill: $('hfill'), hzone: $('hzone'), hgoal: $('hgoal'), hint: $('hint')
  };

  // ---------- Toestand ----------
  const s = {
    goal: Math.min(GOAL_MAX, Math.max(GOAL_MIN, store.get('goal', 24))),
    spm: 0,
    lastStrokeAt: 0,
    strokes: null,      // slagenaantal van de roeier
    distance: 0, distanceOffset: null,
    pace: 0,            // seconden per 500 m, 0 = onbekend
    elapsed: 0,         // ms actieve roeitijd
    lastClock: performance.now(),
    source: null,       // 'ble' | 'demo' | null
    audioOn: false
  };

  // ---------- Meter ----------
  const CX = 100, CY = 100, R = 84, A0 = 150, A1 = 390; // boog van 240 graden, onderkant open
  const clampSpm = v => Math.min(SPM_MAX, Math.max(SPM_MIN, v));
  const frac = v => (clampSpm(v) - SPM_MIN) / (SPM_MAX - SPM_MIN);
  const pt = (deg, r = R) => { const a = deg * Math.PI / 180; return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; };
  const angleFor = v => A0 + frac(v) * (A1 - A0);
  const arc = (d0, d1, r = R) => {
    if (d1 - d0 < 0.01) d1 = d0 + 0.01;
    const [x0, y0] = pt(d0, r), [x1, y1] = pt(d1, r);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${d1 - d0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  el.track.setAttribute('d', arc(A0, A1));

  function status() {
    if (!s.source) return { key: 'idle', text: 'Niet verbonden' };
    if (!s.spm || performance.now() - s.lastStrokeAt > IDLE_AFTER_MS) return { key: 'idle', text: 'Nog geen slagen' };
    const diff = s.spm - s.goal;
    if (Math.abs(diff) <= TOLERANCE) return { key: 'ok', text: 'Op tempo' };
    return diff < 0 ? { key: 'slow', text: 'Te langzaam' } : { key: 'fast', text: 'Te snel' };
  }

  const COLORS = { ok: 'var(--ok)', slow: 'var(--slow)', fast: 'var(--fast)', idle: 'var(--idle)' };

  function render() {
    const st = status();
    document.documentElement.style.setProperty('--state', COLORS[st.key]);
    const active = st.key !== 'idle';

    // Kaart
    el.zone.setAttribute('d', arc(angleFor(s.goal - TOLERANCE), angleFor(s.goal + TOLERANCE), R + 12));
    el.fill.setAttribute('d', active ? arc(A0, angleFor(s.spm)) : '');
    const [nx, ny] = pt(angleFor(active ? s.spm : SPM_MIN));
    el.needle.setAttribute('cx', nx.toFixed(2)); el.needle.setAttribute('cy', ny.toFixed(2));
    el.needle.style.display = active ? '' : 'none';
    const ga = angleFor(s.goal), [gx0, gy0] = pt(ga, R - 9), [gx1, gy1] = pt(ga, R + 16);
    el.goalTick.setAttribute('x1', gx0); el.goalTick.setAttribute('y1', gy0);
    el.goalTick.setAttribute('x2', gx1); el.goalTick.setAttribute('y2', gy1);

    // Balk
    el.hfill.style.width = active ? (frac(s.spm) * 100).toFixed(1) + '%' : '0';
    el.hzone.style.left = (frac(s.goal - TOLERANCE) * 100).toFixed(1) + '%';
    el.hzone.style.width = ((frac(s.goal + TOLERANCE) - frac(s.goal - TOLERANCE)) * 100).toFixed(1) + '%';
    el.hgoal.style.left = (frac(s.goal) * 100).toFixed(1) + '%';

    // Teksten (in kaart en balk tegelijk)
    setText('spm', active ? String(Math.round(s.spm)) : '--');
    setText('state', st.text);
    setText('goal', String(s.goal));
    setText('dist', Math.max(0, Math.floor(s.distance - (s.distanceOffset || 0))).toLocaleString('nl-NL'));
    setText('time', fmtTime(s.elapsed / 1000));
    setText('pace', active && s.pace > 0 && s.pace < 600 ? fmtTime(s.pace) : '-:--');
    pip.draw(st, active);
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }

  // Klok: telt alleen door zolang er geroeid wordt
  function clock() {
    const now = performance.now();
    if (s.source && s.lastStrokeAt && now - s.lastStrokeAt < IDLE_AFTER_MS) s.elapsed += now - s.lastClock;
    s.lastClock = now;
    render();
  }
  setInterval(clock, 250);

  // Nieuwe meetwaarden (van de roeier of de demo)
  function onData({ spm, strokes, distance, pace }) {
    const now = performance.now();
    if (strokes != null) {
      // Een nieuwe slag herken je aan een hoger slagenaantal, niet aan elk bericht
      if (s.strokes !== null && strokes !== s.strokes) s.lastStrokeAt = now;
      s.strokes = strokes;
    }
    if (spm != null) s.spm = spm;
    if (distance != null) {
      if (s.distanceOffset === null) s.distanceOffset = distance; // begin bij nul, ook als de ESP32 al telde
      if (distance < s.distanceOffset) s.distanceOffset = 0;       // ESP32 opnieuw gestart
      s.distance = distance;
    }
    if (pace != null) s.pace = pace;
    render();
  }

  function resetSession() {
    s.distanceOffset = s.distance;
    s.elapsed = 0;
    if (s.source === 'demo') demo.reset();
    render();
    hint('Afstand en tijd staan weer op nul.');
  }

  function setGoal(v) {
    s.goal = Math.min(GOAL_MAX, Math.max(GOAL_MIN, v));
    store.set('goal', s.goal);
    metro.retime();
    render();
  }

  // ---------- Metronoom (Web Audio) ----------
  const metro = (() => {
    let ctx = null, timer = null, nextAt = 0;
    const LOOKAHEAD = 0.12;

    function ensure() {
      // Naast andere geluiden (film) spelen in plaats van ze te pauzeren
      try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();
      }
      if (ctx.state !== 'running') ctx.resume();
      return true;
    }

    function click(t, off) {
      // Zachte tik; buiten het doel een lagere, iets doffere tik
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = off ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(off ? 520 : 1046, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(off ? 0.22 : 0.28, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (off ? 0.12 : 0.07));
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.15);
    }

    function loop() {
      if (!ctx) return;
      const interval = 60 / s.goal;
      while (nextAt < ctx.currentTime + LOOKAHEAD) {
        if (nextAt < ctx.currentTime) nextAt = ctx.currentTime + 0.02;
        const st = status().key;
        click(nextAt, st === 'slow' || st === 'fast');
        nextAt += interval;
      }
    }

    return {
      start() {
        if (!ensure()) return false;
        nextAt = ctx.currentTime + 0.05;
        clearInterval(timer); timer = setInterval(loop, 25); loop();
        return true;
      },
      stop() { clearInterval(timer); timer = null; },
      retime() { if (timer && ctx) nextAt = Math.min(nextAt, ctx.currentTime + 60 / s.goal); }
    };
  })();

  function setAudio(on) {
    s.audioOn = on && metro.start();
    if (!s.audioOn) metro.stop();
    all('[data-act="audio"]').forEach(b => {
      b.classList.toggle('on', s.audioOn);
      b.setAttribute('aria-pressed', String(s.audioOn));
      b.querySelector('use').setAttribute('href', s.audioOn ? '#i-on' : '#i-off');
    });
  }

  // ---------- Scherm aan houden ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && s.source) keepAwake(); });

  // ---------- Bluetooth (FTMS, Rower Data 0x2AD1) ----------
  const FTMS = 0x1826, ROWER_DATA = 0x2ad1;
  let device = null, wantConnected = false, retryTimer = null;

  function parseRowerData(dv) {
    let i = 0;
    const flags = dv.getUint16(i, true); i += 2;
    const out = {};
    if (!(flags & 0x0001)) { out.spm = dv.getUint8(i) / 2; out.strokes = dv.getUint16(i + 1, true); i += 3; } // slagtempo (0,5 nauwkeurig) + aantal slagen
    if (flags & 0x0002) i += 1;                                               // gemiddeld slagtempo
    if (flags & 0x0004) { out.distance = dv.getUint16(i, true) | (dv.getUint8(i + 2) << 16); i += 3; }
    if (flags & 0x0008) { out.pace = dv.getUint16(i, true); i += 2; }        // seconden per 500 m
    return out;
  }

  function setConn(state, label) {
    all('[data-act="conn"]').forEach(b => {
      b.classList.toggle('connected', state === 'on');
      b.classList.toggle('busy', state === 'busy');
      b.classList.toggle('cta', state === 'off');
      b.setAttribute('aria-label', label);
      b.title = label;
    });
  }

  async function connectGatt() {
    setConn('busy', 'Bezig met verbinden');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(FTMS);
    const ch = await svc.getCharacteristic(ROWER_DATA);
    ch.addEventListener('characteristicvaluechanged', e => { if (s.source === 'ble') onData(parseRowerData(e.target.value)); });
    await ch.startNotifications();
    setConn('on', 'Verbonden met ' + (device.name || 'de roeier'));
    hint('Verbonden met de roeier.');
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    if (!wantConnected) return;
    setConn('busy', 'Verbinding kwijt, opnieuw verbinden');
    retryTimer = setTimeout(async () => {
      try { await connectGatt(); } catch (e) { scheduleRetry(); }
    }, 3000);
  }

  async function connect() {
    if (!navigator.bluetooth) {
      hint('Deze browser kan geen Bluetooth. Open deze pagina in Bluefy.');
      return;
    }
    try {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: [FTMS] }] });
      device.addEventListener('gattserverdisconnected', scheduleRetry);
      wantConnected = true;
      stopDemo();
      s.source = 'ble';
      s.distanceOffset = null;
      s.strokes = null;
      await connectGatt();
      keepAwake();
    } catch (e) {
      if (e && e.name === 'NotFoundError') { if (!wantConnected) setConn('off', 'Verbinden met de roeier'); return; }
      if (wantConnected) scheduleRetry();
      else { setConn('off', 'Verbinden met de roeier'); hint('Verbinden lukte niet. Probeer het nog eens.'); }
    }
  }

  function disconnect() {
    wantConnected = false;
    clearTimeout(retryTimer);
    try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (e) {}
    if (s.source === 'ble') s.source = null;
    setConn('off', 'Verbinden met de roeier');
    render();
  }

  // ---------- Demo ----------
  const demo = (() => {
    let timer = null, t0 = 0, dist = 0, count = 0;
    function stroke() {
      const t = (performance.now() - t0) / 1000;
      // Tempo schommelt rustig rond het doel, met af en toe een uitschieter
      const spm = Math.max(14, Math.min(38, s.goal + 3.2 * Math.sin(t / 9) + 1.6 * Math.sin(t / 3.1) + (Math.random() - .5)));
      const pace = Math.max(95, 150 - (spm - 20) * 2.2 + (Math.random() - .5) * 4); // s per 500 m
      const interval = 60 / spm;
      dist += 500 / pace * interval;
      onData({ spm: Math.round(spm * 2) / 2, strokes: ++count, distance: dist, pace: Math.round(pace) });
      timer = setTimeout(stroke, interval * 1000);
    }
    return {
      start() { t0 = performance.now(); dist = 0; count = 0; s.strokes = 0; s.distanceOffset = 0; s.distance = 0; s.elapsed = 0; stroke(); },
      stop() { clearTimeout(timer); timer = null; },
      reset() { dist = 0; s.distance = 0; s.distanceOffset = 0; }
    };
  })();

  function setDemoButtons(on) {
    all('[data-act="demo"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  }

  function stopDemo() {
    demo.stop();
    setDemoButtons(false);
    if (s.source === 'demo') { s.source = null; s.spm = 0; }
  }

  function toggleDemo() {
    if (s.source === 'demo') { stopDemo(); render(); return; }
    if (wantConnected) { hint('Verbreek eerst de verbinding met de roeier.'); return; }
    s.source = 'demo';
    setDemoButtons(true);
    demo.start();
    keepAwake();
    hint('Demo: er komen nagebootste slagen binnen.');
  }

  // ---------- Zwevende balk (Picture-in-Picture van een canvas) ----------
  const pip = (() => {
    const cv = document.getElementById('pipCanvas'), vid = document.getElementById('pipVideo');
    const g = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const FONT = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
    const HEX = { ok: '#30d158', slow: '#ff9f0a', fast: '#ff453a', idle: '#4a525c' };
    let ready = false, tickFlip = false;

    function draw(st, active) {
      if (!g) return;
      const col = HEX[st.key];
      g.fillStyle = '#111418'; g.fillRect(0, 0, W, H);

      // Luidspreker
      g.save(); g.translate(44, H / 2);
      g.fillStyle = s.audioOn ? HEX.ok : '#7d8793';
      g.beginPath(); g.moveTo(-14, -9); g.lineTo(-5, -9); g.lineTo(7, -20); g.lineTo(7, 20); g.lineTo(-5, 9); g.lineTo(-14, 9); g.closePath(); g.fill();
      g.strokeStyle = g.fillStyle; g.lineWidth = 4.5; g.lineCap = 'round';
      if (s.audioOn) { g.beginPath(); g.arc(9, 0, 11, -0.8, 0.8); g.stroke(); g.beginPath(); g.arc(9, 0, 20, -0.8, 0.8); g.stroke(); }
      else { g.beginPath(); g.moveTo(16, -8); g.lineTo(30, 8); g.moveTo(30, -8); g.lineTo(16, 8); g.stroke(); }
      g.restore();

      // Balk met doelgebied
      const bx = 100, bw = 220, by = H / 2 - 7, bh = 14;
      const fx = v => bx + frac(v) * bw;
      const rr = (x, y, w, h, r, c) => { g.fillStyle = c; g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); };
      rr(bx, by, bw, bh, 7, '#23292f');
      if (active) rr(bx, by, Math.max(bh, fx(s.spm) - bx), bh, 7, col);
      rr(fx(s.goal - TOLERANCE), by - 13, fx(s.goal + TOLERANCE) - fx(s.goal - TOLERANCE), 5, 2.5, HEX.ok);
      g.fillStyle = '#f2f4f6'; g.fillRect(fx(s.goal) - 1.5, by - 16, 3, bh + 32);

      // 26 / 24 SPM
      let x = 352;
      g.textBaseline = 'alphabetic';
      g.font = `700 64px ${FONT}`; g.fillStyle = active ? col : '#7d8793';
      const t1 = active ? String(Math.round(s.spm)) : '--';
      g.fillText(t1, x, 112); x += g.measureText(t1).width + 10;
      g.font = `600 44px ${FONT}`; g.fillStyle = '#7d8793'; g.fillText('/', x, 110); x += g.measureText('/').width + 10;
      g.font = `700 64px ${FONT}`; g.fillStyle = '#f2f4f6'; g.fillText(String(s.goal), x, 112); x += g.measureText(String(s.goal)).width + 10;
      g.font = `600 22px ${FONT}`; g.fillStyle = '#7d8793'; g.fillText('SPM', x, 110);

      // Afstand en tijd rechts
      g.textAlign = 'right';
      g.font = `650 36px ${FONT}`; g.fillStyle = '#f2f4f6';
      g.fillText(Math.max(0, Math.floor(s.distance - (s.distanceOffset || 0))).toLocaleString('nl-NL') + ' m', W - 30, 82);
      g.font = `500 32px ${FONT}`; g.fillStyle = '#9aa3ad';
      g.fillText(fmtTime(s.elapsed / 1000), W - 30, 128);
      g.textAlign = 'left';

      // Klein verschil per beeld, zodat de videostroom altijd nieuwe beelden krijgt
      tickFlip = !tickFlip; g.fillStyle = tickFlip ? '#111418' : '#121519'; g.fillRect(0, H - 1, 1, 1);
    }

    function setup() {
      if (ready) return true;
      if (!cv.captureStream) return false;
      vid.srcObject = cv.captureStream(4);
      vid.play().catch(() => {});
      ready = true;
      return true;
    }

    function isOn() {
      return document.pictureInPictureElement === vid || vid.webkitPresentationMode === 'picture-in-picture';
    }

    function setButtons() {
      const on = isOn();
      all('[data-act="pip"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    }
    vid.addEventListener('enterpictureinpicture', setButtons);
    vid.addEventListener('leavepictureinpicture', setButtons);
    vid.addEventListener('webkitpresentationmodechanged', setButtons);

    function toggle() {
      if (!setup()) { hint('Deze browser kan geen zwevende balk maken.'); return; }
      try {
        if (isOn()) {
          if (document.exitPictureInPicture && document.pictureInPictureElement) document.exitPictureInPicture();
          else if (vid.webkitSetPresentationMode) vid.webkitSetPresentationMode('inline');
          return;
        }
        vid.play().catch(() => {});
        if (vid.requestPictureInPicture) {
          vid.requestPictureInPicture().then(setButtons).catch(e => hint('Zwevende balk lukte niet: ' + (e && e.message ? e.message : 'onbekende fout')));
        } else if (vid.webkitSupportsPresentationMode && vid.webkitSupportsPresentationMode('picture-in-picture')) {
          vid.webkitSetPresentationMode('picture-in-picture');
        } else {
          hint('Deze browser kan geen zwevende balk maken.');
        }
      } catch (e) { hint('Zwevende balk lukte niet: ' + e.message); }
    }

    // Alvast klaarzetten, zodat de knop direct kan starten
    setup();
    return { draw, toggle };
  })();

  // ---------- Knoppen ----------
  const actions = {
    minus: () => setGoal(s.goal - 1),
    plus: () => setGoal(s.goal + 1),
    reset: resetSession,
    audio: () => setAudio(!s.audioOn),
    demo: toggleDemo,
    pip: () => pip.toggle(),
    conn: () => { if (wantConnected) { if (confirm('Verbinding met de roeier verbreken?')) disconnect(); } else connect(); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && actions[b.dataset.act]) actions[b.dataset.act]();
  });

  // ---------- Melding ----------
  let hintTimer = null;
  function hint(text) {
    el.hint.textContent = text;
    el.hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => el.hint.classList.remove('show'), 3200);
  }

  setAudio(false);
  setConn('off', 'Verbinden met de roeier');
  render();
})();
</script>
</body>
</html>
