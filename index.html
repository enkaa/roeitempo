<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roeitempo</title>
<style>
  :root {
    --bg: #0b0d10;
    --tile: #161a1f;
    --raise: #22282f;
    --line: #262c34;
    --text: #f2f4f6;
    --soft: #c9ced4;
    --muted: #7d8793;
    --ok: #30d158;
    --slow: #ff9f0a;
    --fast: #ff453a;
    --idle: #5d6773;
    --blue: #0a84ff;
    --state: var(--idle);
    --gap: clamp(8px, 1.6vmin, 14px);
    --r: clamp(12px, 2.4vmin, 20px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, button, .tile { touch-action: manipulation; }   /* geen inzoomen bij snel twee keer tikken */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  body { display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; padding: 0; border: 0; background: none; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Tegels: breed venster = tempo links, rechts ritme, doel en metronoom, onderin de cijfers */
  .tiles { flex: 1; min-width: 0; min-height: 0; display: grid; gap: var(--gap);
    padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right)) max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas:
      "top top top top top top"
      "tempo tempo tempo ritme ritme ritme"
      "tempo tempo tempo doel doel doel"
      "tempo tempo tempo metro metro metro"
      "s1 s1 s2 s2 s3 s3"; }
  /* Staand venster: alles onder elkaar */
  @media (max-aspect-ratio: 1/1) {
    .tiles { grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      grid-template-areas:
        "top top top top top top"
        "tempo tempo tempo tempo tempo tempo"
        "ritme ritme ritme ritme ritme ritme"
        "doel doel doel doel doel doel"
        "metro metro metro metro metro metro"
        "s1 s1 s2 s2 s3 s3"; }
  }
  /* Smal scherm (iPhone): bovenbalk op één regel */
  @media (max-width: 520px) {
    .top .chip { padding: 0 12px; }
    .chip .wide-only { display: none; }
    .chip.pipchip { width: 38px; padding: 0; justify-content: center; }
    .ed .blk { grid-template-columns: 1fr; }
    .ed .mini .v small { display: inline; margin-left: 5px; font-size: 13px; }
  }

  .top { grid-area: top; display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--gap); }   /* linksboven vrij voor de vensterknopjes */
  .tile { background: var(--tile); border-radius: var(--r); padding: clamp(10px, 2.2vmin, 18px); min-width: 0; min-height: 0; position: relative; }
  .lbl { font-size: clamp(10px, 1.7vmin, 13px); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

  .t-tempo { grid-area: tempo; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
  .big { display: flex; align-items: baseline; gap: .12em; line-height: .9; font-size: clamp(56px, 19vmin, 170px); }
  .big .now { font-weight: 700; color: var(--state); transition: color .4s; letter-spacing: -.03em; }
  .big .of { font-size: .32em; font-weight: 600; color: var(--soft); }
  .cue { font-size: clamp(14px, 2.8vmin, 22px); font-weight: 600; color: var(--state); transition: color .4s; }

  .t-ritme { grid-area: ritme; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; min-height: 90px; }
  .ratio { font-size: clamp(13px, 2.2vmin, 17px); color: var(--muted); min-height: 1.3em; }
  .t-ritme canvas { width: 100%; height: 100%; display: block; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .t-doel { grid-area: doel; }
  .t-metro { grid-area: metro; }
  .stepper { display: flex; align-items: center; gap: clamp(8px, 1.6vmin, 14px); }
  .stepper .v { font-size: clamp(20px, 3.6vmin, 30px); font-weight: 700; min-width: 2ch; text-align: center; }
  .pm { width: clamp(38px, 6.4vmin, 52px); height: clamp(38px, 6.4vmin, 52px); border-radius: 50%; background: var(--raise); display: grid; place-items: center; }
  .pm svg { width: 40%; height: 40%; }
  .pm:active, .ib:active, .chip:active { filter: brightness(1.4); }

  .switch { width: 54px; height: 32px; border-radius: 16px; background: #3a4049; position: relative; transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--ok); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }

  .stat { display: flex; flex-direction: column; justify-content: space-between; gap: clamp(8px, 2vmin, 18px); }
  .stat .v { font-size: clamp(20px, 5.4vmin, 44px); font-weight: 650; line-height: 1; white-space: nowrap; }
  .s1 { grid-area: s1; } .s2 { grid-area: s2; } .s3 { grid-area: s3; }

  /* Knoppen bovenin */
  .ib { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--tile); color: var(--muted); display: grid; place-items: center; position: relative; }
  .ib svg { width: 52%; height: 52%; }
  .ib.bt.cta { color: #fff; background: var(--blue); }
  .ib.bt.connected { color: var(--blue); }
  .ib.bt.busy { color: var(--slow); }
  .ib.bt .dot { position: absolute; right: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bg); display: none; }
  .ib.bt.connected .dot { display: block; }
  .chip { flex: none; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--tile); color: var(--soft);
    font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .chip svg { width: 18px; height: 18px; }
  .chip.on { color: var(--ok); background: rgba(48, 209, 88, .14); }
  .chip.go { background: var(--blue); color: #fff; }
  .top [hidden] { display: none; }

  .t-doel { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .prog { font-size: clamp(12px, 1.9vmin, 14px); color: var(--soft); font-variant-numeric: tabular-nums; }
  .prog:empty { display: none; }
  .segs { display: flex; gap: 2px; height: 6px; }
  .segs:empty { display: none; }
  .segs span { position: relative; border-radius: 2px; overflow: hidden; min-width: 2px; }
  .segs span::before { content: ""; position: absolute; inset: 0; background: var(--c); opacity: .28; }
  .segs i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); }

  /* Paneel voor training, overzicht en eerdere trainingen */
  .sheet { position: fixed; inset: 0; z-index: 15; background: rgba(5, 6, 8, .72); display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .sheet[hidden] { display: none; }
  .panel { background: #15191e; border: 1px solid var(--line); border-radius: 20px; width: min(560px, 100%); max-height: 100%; overflow: auto;
    padding: 20px; display: grid; gap: 14px; -webkit-user-select: none; }
  .panel h2 { margin: 0; font-size: 20px; }
  .panel p { margin: 0; color: var(--muted); font-size: 14px; }
  .panel .sec { display: grid; gap: 8px; }
  .panel .sec > .lbl { margin-top: 4px; }
  .choice { display: grid; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 14px; background: var(--raise); border: 2px solid transparent; }
  .choice b { font-size: 15px; font-weight: 600; }
  .choice span { font-size: 13px; color: var(--muted); }
  .choice[aria-pressed="true"] { border-color: var(--blue); }
  .linkbtn { justify-self: start; color: var(--blue); font-size: 14px; font-weight: 600; padding: 4px 0; }
  .ed .sum1 { font-size: 14px; font-weight: 600; }
  .ed > .del { justify-self: start; color: var(--muted); font-size: 13px; }
  .ib.setbtn.on { color: var(--ok); }
  .ed { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: #1b2026; }
  .part { display: grid; gap: 8px; }
  .part + .part { border-top: 1px solid var(--line); padding-top: 12px; }
  .blk { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 10px 12px; border-radius: 12px; background: var(--raise); }
  .blk .head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
  .blk .del { color: var(--muted); font-size: 13px; padding: 2px 0 2px 10px; }
  .mini { display: flex; align-items: center; justify-content: space-between; gap: 4px; min-width: 0; }
  .mini button { flex: none; width: 34px; height: 34px; border-radius: 50%; background: #2e353e; font-size: 18px; line-height: 1; }
  .mini .v { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .mini .v small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .partfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .partfoot .mini { gap: 8px; }
  .btn.small { height: 38px; font-size: 14px; padding: 0 14px; }
  .panel textarea { width: 100%; min-height: 150px; resize: vertical; background: #0f1215; color: var(--text); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; font: 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace; -webkit-user-select: text; user-select: text; }
  .panel pre { margin: 0; padding: 10px 12px; border-radius: 10px; background: #0f1215; color: var(--soft); font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
  .readout { display: grid; gap: 4px; font-size: 14px; color: var(--soft); }
  .readout .bad { color: var(--slow); }
  .foot { position: sticky; bottom: -20px; margin: 0 -20px -20px; padding: 12px 20px 20px; background: #15191e; border-top: 1px solid var(--line); }
  .btn { height: 46px; border-radius: 12px; background: var(--raise); font-size: 15px; font-weight: 600; padding: 0 16px; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.wide { width: 100%; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btns .btn { flex: 1 1 140px; }
  .sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .sum div { background: var(--raise); border-radius: 14px; padding: 12px 14px; }
  .sum .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .hist { display: grid; gap: 6px; }
  .hist div { background: var(--raise); border-radius: 12px; padding: 10px 14px; font-size: 14px; display: grid; gap: 2px; }
  .hist .d { color: var(--muted); font-size: 13px; }
  .hist .del { justify-self: start; color: var(--muted); font-size: 13px; padding: 4px 0 0; }
  .hist .acts { display: flex; gap: 18px; }
  .hist .acts .fit { color: var(--blue); }

  .pipwrap { position: fixed; inset: 0; z-index: 10; background: rgba(11, 13, 16, .94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .pipwrap.show { opacity: 1; pointer-events: auto; }
  .pipwrap p { margin: 0; font-size: 15px; color: var(--text); }
  .pipwrap video { width: min(92vw, 520px); aspect-ratio: 840 / 128; border-radius: 10px; background: #111418; cursor: pointer; }
  .hint { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 50px); transform: translateX(-50%); background: #2a3037; color: var(--text);
    font-size: 13px; padding: 8px 14px; border-radius: 10px; max-width: 92vw; text-align: center; width: max-content;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; }
  .hint.show { opacity: 1; }
  .sheet:not([hidden]) ~ .hint { top: auto; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 96px); }   /* boven de knoppen van het paneel */
</style>
</head>
<body>

<!-- Pictogrammen -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-bt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3.5 4v4.5H8"/></symbol>
    <symbol id="i-pip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><rect x="11.5" y="12" width="7" height="4.5" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.6"/><circle cx="10" cy="17" r="2.6"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></symbol>
  </defs>
</svg>

<main class="tiles">
  <div class="top">
    <button class="chip" data-act="training" type="button">Training</button>
    <button class="chip go" data-act="finish" type="button" hidden>Afronden</button>
    <button class="ib setbtn" data-act="settings" type="button" aria-label="Instellingen" title="Instellingen"><svg><use href="#i-set"/></svg></button>
    <button class="ib" data-act="reset" id="resetBtn" type="button" aria-label="Afstand en tijd op nul zetten" title="Afstand en tijd op nul zetten"><svg><use href="#i-reset"/></svg></button>
    <button class="chip pipchip" data-act="pip" type="button" aria-pressed="false" aria-label="Zwevende balk"><svg><use href="#i-pip"/></svg><span class="wide-only">Zwevende balk</span></button>
    <button class="ib bt cta" data-act="conn" type="button" aria-label="Verbinden met de roeier"><svg><use href="#i-bt"/></svg><span class="dot"></span></button>
  </div>

  <section class="tile t-tempo">
    <div class="lbl">Tempo</div>
    <div class="big num"><span class="now" data-v="spm">--</span><span class="of">/ <span data-v="goal">24</span></span></div>
    <div class="cue" data-v="state">Niet verbonden</div>
  </section>

  <section class="tile t-ritme">
    <div class="lbl">Ritme</div>
    <canvas id="ritme" aria-label="Roeiertje dat de slag voordoet op het doeltempo"></canvas>
    <div class="ratio" data-v="ratio"></div>
  </section>

  <section class="tile t-doel">
    <div class="row">
      <div class="lbl">Doel</div>
      <div class="stepper">
        <button class="pm" data-act="minus" type="button" aria-label="Doeltempo lager"><svg><use href="#i-minus"/></svg></button>
        <span class="v num" data-v="goal">24</span>
        <button class="pm" data-act="plus" type="button" aria-label="Doeltempo hoger"><svg><use href="#i-plus"/></svg></button>
      </div>
    </div>
    <div class="prog" data-v="prog"></div>
    <div class="segs" id="segs" aria-hidden="true"></div>
  </section>

  <section class="tile t-metro row">
    <div class="lbl" id="metroLbl">Metronoom</div>
    <button class="switch" data-act="audio" type="button" role="switch" aria-checked="false" aria-labelledby="metroLbl"></button>
  </section>

  <section class="tile stat s1"><div class="lbl">Meter</div><div class="v num" data-v="dist">0</div></section>
  <section class="tile stat s2"><div class="lbl">Tijd</div><div class="v num" data-v="time">0:00</div></section>
  <section class="tile stat s3"><div class="lbl">Per 500 m</div><div class="v num" data-v="pace">-:--</div></section>
</main>

<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="hint" id="hint"></div>

<!-- Zwevende balk: wordt op dit canvas getekend en als video in Picture-in-Picture gezet -->
<canvas id="pipCanvas" width="840" height="128" style="position:fixed;left:-9999px;top:0"></canvas>
<div class="pipwrap" id="pipWrap">
  <p>Tik op de balk om hem te laten zweven.</p>
  <video id="pipVideo" muted playsinline autoplay></video>
  <button class="chip" data-act="pipclose" type="button">Annuleren</button>
</div>

<script>
(() => {
  'use strict';

  // ---------- Instellingen ----------
  const SPM_MIN = 10, SPM_MAX = 40;   // bereik van de meter
  const GOAL_MIN = 14, GOAL_MAX = 40;
  const TOLERANCE = 2;                // binnen +/- 2 slagen = op tempo
  const IDLE_AFTER_MS = 6000;         // geen nieuwe slag binnen 6 s = stilstand
  const NEW_SESSION_AFTER_MS = 10 * 60 * 1000;   // na 10 minuten zonder slag begint een nieuwe training (zo lang wacht ook de slaapstand van de ESP32)

  const store = {
    get(k, d) { try { const v = localStorage.getItem('roeitempo.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('roeitempo.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const $ = id => document.getElementById(id);
  const all = sel => document.querySelectorAll(sel);
  const setText = (key, text) => all(`[data-v="${key}"]`).forEach(n => { if (n.textContent !== text) n.textContent = text; });
  const el = { hint: $('hint'), ritme: $('ritme') };

  // ---------- Toestand ----------
  const s = {
    goal: Math.min(GOAL_MAX, Math.max(GOAL_MIN, store.get('goal', 24))),
    spm: 0,
    lastStrokeAt: 0,
    strokes: null,      // slagenaantal van de roeier
    distance: 0, distanceOffset: null, carry: 0,   // carry: meters van voor een herstart van de ESP32
    pace: 0,            // seconden per 500 m, 0 = onbekend
    elapsed: 0,         // ms actieve roeitijd
    lastClock: performance.now(),
    source: null,       // 'ble' | 'demo' | null
    audioOn: false,
    flash: null,        // korte melding in de zwevende balk: { text, until }
    prog: null,         // lopend schema: { name, steps: [{ sec, spm }], start (ms roeitijd), idx }
    sess: null          // cijfers voor het overzicht na afloop
  };
  const newSess = () => { s.sess = { startedAt: null, activeMs: 0, onTargetMs: 0, spmMs: 0, strokes: 0 }; };
  newSess();

  function status() {
    if (!s.source) return { key: 'idle', text: 'Niet verbonden' };
    if (!s.spm || performance.now() - s.lastStrokeAt > IDLE_AFTER_MS) return { key: 'idle', text: 'Nog geen slagen' };
    const diff = s.spm - s.goal;
    if (Math.abs(diff) <= TOLERANCE) return { key: 'ok', text: 'Op tempo' };
    return diff < 0 ? { key: 'slow', text: 'Sneller' } : { key: 'fast', text: 'Rustiger' };
  }

  const COLORS = { ok: 'var(--ok)', slow: 'var(--slow)', fast: 'var(--fast)', idle: 'var(--idle)' };

  function render() {
    const st = status();
    document.documentElement.style.setProperty('--state', COLORS[st.key]);
    const active = st.key !== 'idle';

    // Teksten in de tegels
    setText('spm', active ? String(Math.round(s.spm)) : '--');
    setText('state', st.text);
    setText('goal', String(s.goal));
    setText('dist', meters().toLocaleString('nl-NL'));
    setText('time', fmtTime(s.elapsed / 1000));
    setText('pace', active && s.pace > 0 && s.pace < 600 ? fmtTime(s.pace) : '-:--');
    setText('ratio', ratioText(active));
    const pi = progInfo();
    setText('prog', pi ? `Blok ${pi.idx + 1} van ${pi.n}, nog ${fmtTime(pi.rem)}.` + (pi.next ? ` Daarna tempo ${pi.next.spm}.` : ' Dit is het laatste blok.') : '');
    drawSegs(pi);
    // Is er genoeg geroeid, dan staat Afronden bovenin (in plaats van op nul zetten)
    const canFinish = meters() >= 10 || s.elapsed >= 30000;
    const fb = document.querySelector('.top [data-act="finish"]');
    if (fb.hidden === canFinish) { fb.hidden = !canFinish; $('resetBtn').hidden = canFinish; }
    pip.draw(st, active);
  }

  // Terugkomen ten opzichte van de haal, over hetzelfde middenstuk (gemiddelde van de laatste 3 slagen)
  function ratioText(active) {
    if (!active || !s.ratios || !s.ratios.length || performance.now() - s.ratioAt > 15000) return '';
    const r = s.ratios.reduce((a, b) => a + b, 0) / s.ratios.length;
    const tip = r < 1.4 ? 'Kom rustiger terug.' : r > 2.6 ? 'Je mag iets vlotter terugkomen.' : 'Mooi ritme.';
    return `Terugkomen duurt ${nlNum(r, 1)} keer zo lang als de haal. ${tip}`;
  }

  // Kleur per blok: rustig = blauw, zwaar = paars (los van groen/oranje/rood, die over je tempo gaan)
  function segColor(spm, steps) {
    const lo = Math.min(...steps.map(x => x.spm)), hi = Math.max(...steps.map(x => x.spm));
    const f = hi > lo ? (spm - lo) / (hi - lo) : 0;

  // Klok: telt alleen door zolang er geroeid wordt

  function resetSession(quiet) {

  function flash(text) { s.flash = { text, until: performance.now() + 1600 }; }
  function setGoal(v, note) {

  // ---------- Ritmeklok (gedeeld door metronoom en ritme-stip) ----------
  const beat = { origin: performance.now(), interval: 60000 / s.goal };
  const beatPhase = (now = performance.now()) => (((now - beat.origin) / beat.interval) % 1 + 1) % 1;
  function reanchorBeat() {
    // Nieuw doeltempo: zelfde plek in de slag houden, alleen sneller of langzamer verder
    const now = performance.now(), ph = beatPhase(now);

  // Positie van de ritme-stip: snel heen (haal, 1/3 van de slag), rustig terug (herstel, 2/3)
  const DRIVE = 1 / 3;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const ease = k => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(k));   // versnellen en afremmen
  const lerp = (a, b, k) => a + (b - a) * k;
  // Haal: benen, dan lijf, dan armen. Terug: armen, dan lijf, dan benen.
  function strokeParts(ph) {
    const drive = ph < DRIVE, k = drive ? ph / DRIVE : (ph - DRIVE) / (1 - DRIVE);
    if (drive) return { legs: ease(k / 0.65), body: ease((k - 0.45) / 0.45), arms: ease((k - 0.7) / 0.3) };
    return { arms: 1 - ease(k / 0.25), body: 1 - ease((k - 0.15) / 0.3), legs: 1 - ease((k - 0.35) / 0.65) };
  }

  // Roeiertje dat de slag voordoet, kijkt naar links (daar zit de machine)
function drawRower(g, x, y, w, h, ph) {
    const p = strokeParts(ph);
    // Groen = dit lichaamsdeel nu aanspannen. Alleen tijdens de haal: benen, dan lijf, dan armen; geleidelijk aan en uit.
    const k = ph < DRIVE ? ph / DRIVE : -1;
    const work = (a, b) => (k >= a && k <= b) ? Math.sin(Math.PI * (k - a) / (b - a)) : 0;
    const mix = (hex, t) => { const c = [1, 3, 5].map(i => parseInt(hex.substr(i, 2), 16)), gr = [48, 209, 88];
      return 'rgb(' + c.map((v, i) => Math.round(v + (gr[i] - v) * Math.min(1, t * 1.4))).join(',') + ')'; };
    const cLegs = mix('#8a94a1', work(0, 0.7)), cBody = mix('#c9ced4', work(0.4, 0.92)), cArms = mix('#c9ced4', work(0.66, 1));
    const line = (x0, y0, x1, y1, c, lw) => { g.strokeStyle = c; g.lineWidth = lw; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
    const u = Math.min(h / 1.02, w / 1.9), lw = Math.max(1.5, u * 0.06);
    const x0 = x + Math.max(0, (w - 1.9 * u) / 2), ry = y + h - u * 0.05;
    const fx = x0 + u * 0.24, fy = ry - u * 0.14, handleY = ry - u * 0.40;
    const bend = (ax, ay, bx, by, len, pick) => {   // twee gelijke staven, knik naar de gekozen kant
      const dx = bx - ax, dy = by - ay, d = Math.min(Math.hypot(dx, dy), 2 * len - 0.01) || 0.01;
      const off = Math.sqrt(Math.max(0, len * len - (d / 2) ** 2)), mx = (ax + bx) / 2, my = (ay + by) / 2;
      const p1 = [dy / d, -dx / d], p2 = [-dy / d, dx / d], q = pick(p1) >= pick(p2) ? p1 : p2;
      return [mx + q[0] * off, my + q[1] * off];
    };
    line(x0 + u * 0.12, ry, x0 + 1.9 * u, ry, '#262c34', lw);                           // rail
    line(fx - u * 0.05, ry - u * 0.30, fx + u * 0.01, ry - u * 0.02, '#7d8793', lw);   // voetenplank
    const hipX = lerp(fx + u * 0.27, fx + u * 0.70, p.legs), hipY = ry - u * 0.10;
    const [kx, ky] = bend(fx, fy, hipX, hipY, u * 0.36, q => -q[1]);                   // knie omhoog
    const th = lerp(0.40, -0.35, p.body), T = u * 0.42;                                // voorover naar achterover
    const shX = hipX - Math.sin(th) * T, shY = hipY - Math.cos(th) * T;
    const a = u * 0.21, reach = 2 * a * 0.98;
    const extX = shX - Math.sqrt(Math.max(0, reach * reach - (handleY - shY) ** 2));
    const handX = lerp(extX, hipX - Math.sin(th) * T * 0.55 - u * 0.06, p.arms);       // hendel naar de onderste ribben
    const [ex, ey] = bend(shX, shY, handX, handleY, a, q => q[1] + q[0] * 0.6);       // elleboog naar onder en achter
    line(x0, handleY, handX, handleY, '#262c34', lw * 0.7);                            // ketting naar de machine
    line(fx, fy, kx, ky, cLegs, lw); line(kx, ky, hipX, hipY, cLegs, lw);

  // ---------- Metronoom (Web Audio) ----------
  const metro = (() => {
    let ctx = null, timer = null, nextAt = 0;
    const LOOKAHEAD = 0.12;

    function ensure() {
      // Naast andere geluiden (film) spelen in plaats van ze te pauzeren
      try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();
      }
      if (ctx.state !== 'running') ctx.resume();
      return true;
    }

    function click(t, off) {
      // Zachte tik; buiten het doel een lagere, iets doffere tik
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = off ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(off ? 520 : 1046, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(off ? 0.22 : 0.28, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (off ? 0.12 : 0.07));
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.15);
    }

    // Tikken op de gedeelde ritmeklok, zodat tik en ritme-stip samenvallen
    let lastBeat = -1;
    function loop() {
      if (!ctx) return;
      const now = performance.now();
      let k = Math.max(lastBeat + 1, Math.ceil((now - beat.origin) / beat.interval));
      for (;;) {
        const at = beat.origin + k * beat.interval;
        if (at > now + LOOKAHEAD * 1000) break;
        const st = status().key;
        click(ctx.currentTime + Math.max(0.005, (at - now) / 1000), st === 'slow' || st === 'fast');
        lastBeat = k++;
      }
    }

    return {
      start() {
        if (!ensure()) return false;
        lastBeat = Math.floor((performance.now() - beat.origin) / beat.interval);
        clearInterval(timer); timer = setInterval(loop, 25); loop();
        return true;
      },
      stop() { clearInterval(timer); timer = null; },
      retime() { lastBeat = Math.floor((performance.now() - beat.origin) / beat.interval); }
    };
  })();

  function setAudio(on) {
    s.audioOn = on && metro.start();
    if (!s.audioOn) metro.stop();
    all('[data-act="audio"]').forEach(b => b.setAttribute('aria-checked', String(s.audioOn)));
  }

  // ---------- Scherm aan houden ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && s.source) keepAwake(); });

  // ---------- Bluetooth (FTMS, Rower Data 0x2AD1) ----------
  const FTMS = 0x1826, ROWER_DATA = 0x2ad1;
  // Extra gegevens van ESPRowingMonitor, voor het afstellen (opname)
  const EXT_SVC = 'a72a5762-803b-421d-a759-f0314153da97', EXT_METRICS = '808a0d51-efae-4f0c-b2e0-48bc180d65c3',
    DELTA_TIMES = 'ae5d11ea-62f6-4789-b809-6fc93fee92b9', SETTINGS_SVC = '56892de1-7068-4b5a-acaa-473d97b02206',
    CALIB = '2f6b3a8e-5c1d-4e7a-9b3f-1d2c3b4a5e60', CONTROL = 0x2ad9;
  let stand = store.get('stand', 1), ijk = store.get('ijk', 1);   // weerstandsstand R30 en afstand bijstellen (factor)
  let device = null, wantConnected = false, retryTimer = null;
  const rec = { on: false, sub: false, err: '', t0: 0, start: null, rows: [], ext: [], dt: [], dtAt: [] };
  const recT = () => Math.round(performance.now() - rec.t0);
  // Vaste functies: addEventListener voegt dezelfde functie niet twee keer toe (bij opnieuw verbinden). Bluefy kent oncharacteristicvaluechanged niet.
  function onRowerData(e) {
    if (s.source !== 'ble') return;
    const d = parseRowerData(e.target.value);
    if (rec.on) rec.rows.push([recT(), d.spm, d.strokes, d.distance, d.pace]);
    onData(d);
  }
  function onDeltaTimes(e) {
    if (!rec.on) return;
    const v = e.target.value;
    for (let i = 0; i + 4 <= v.byteLength; i += 4) rec.dt.push(v.getUint32(i, true));   // microseconden per impuls
    rec.dtAt.push([recT(), rec.dt.length]);

    if (drive > 0 && back > 0) { s.ratios = [...(s.ratios || []).slice(-2), back / drive]; s.ratioAt = performance.now(); }

    rec.ext.push([recT(), v.getInt16(0, true), +(v.getUint16(2, true) / 4096).toFixed(3), +(v.getUint16(4, true) / 4096).toFixed(3), v.getUint16(6, true)]);

  // Pas bij Opname starten aanmelden voor de extra gegevens; de gewone verbinding blijft zo onaangeroerd.
  async function recSubscribe() {
    if (rec.sub) return true;
    let step = 'dienst';
    try {
      const ext = await device.gatt.getPrimaryService(EXT_SVC);
      step = 'metingen';
      const dch = await ext.getCharacteristic(DELTA_TIMES);
      dch.addEventListener('characteristicvaluechanged', onDeltaTimes);
      await dch.startNotifications();
      step = 'slaggegevens';
      const mch = await ext.getCharacteristic(EXT_METRICS);
      mch.addEventListener('characteristicvaluechanged', onExtMetrics);
      await mch.startNotifications();
      rec.sub = true;
      return true;

    }

  async function afterConnect() {

    await sendSettings();
  }
  async function sendSettings() {
    if (!device || !device.gatt.connected) return;
    try {
      const cp = await (await device.gatt.getPrimaryService(FTMS)).getCharacteristic(CONTROL);
      await cp.writeValue(new Uint8Array([0x00]));                 // controle vragen
      await cp.writeValue(new Uint8Array([0x04, stand * 10]));     // weerstandsstand, in tienden
    } catch (e) {}

      const c = await (await device.gatt.getPrimaryService(EXT_SVC)).getCharacteristic(CALIB);
      const b = new DataView(new ArrayBuffer(4)); b.setFloat32(0, ijk, true);
      await c.writeValue(b.buffer);
    } catch (e) {}
  }
  function recShow() { const el = document.getElementById('recN'); if (el) el.textContent = `${nlNum(rec.dt.length)} metingen, ${nlNum(rec.ext.length)} ${rec.ext.length === 1 ? 'slag' : 'slagen'}`; }

  function parseRowerData(dv) {
    let i = 0;
    const flags = dv.getUint16(i, true); i += 2;
    const out = {};
    if (!(flags & 0x0001)) { out.spm = dv.getUint8(i) / 2; out.strokes = dv.getUint16(i + 1, true); i += 3; } // slagtempo (0,5 nauwkeurig) + aantal slagen

    if (flags & 0x0008) { out.pace = dv.getUint16(i, true); i += 2; }        // seconden per 500 m
    return out;
  }

  function setConn(state, label) {
    all('[data-act="conn"]').forEach(b => {
      b.classList.toggle('connected', state === 'on');
      b.classList.toggle('busy', state === 'busy');
      b.classList.toggle('cta', state === 'off');
      b.setAttribute('aria-label', label);
      b.title = label;
    });
  }

  async function connectGatt() {
    setConn('busy', 'Bezig met verbinden');
    rec.sub = false;
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(FTMS);
    const ch = await svc.getCharacteristic(ROWER_DATA);
    ch.addEventListener('characteristicvaluechanged', onRowerData);
    await ch.startNotifications();
    setTimeout(afterConnect, 300);
    setConn('on', 'Verbonden met ' + (device.name || 'de roeier'));
    hint('Verbonden met de roeier.');
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    if (!wantConnected) return;
    setConn('busy', 'Verbinding kwijt, opnieuw verbinden');
    retryTimer = setTimeout(async () => {
      try { await connectGatt(); } catch (e) { scheduleRetry(); }
    }, 3000);
  }

  async function connect() {
    if (!navigator.bluetooth) {
      hint('Deze browser kan geen Bluetooth. Open deze pagina in Bluefy.');
      return;
    }
    try {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: [FTMS] }], optionalServices: [EXT_SVC, SETTINGS_SVC] });
      await useDevice(device);
    } catch (e) {

      else { setConn('off', 'Verbinden met de roeier'); hint('Verbinden lukte niet. Probeer het nog eens.'); }
    }
  }

  async function useDevice(d) {
    device = d;
    store.set('auto', true);                // de volgende keer bij openen meteen verbinden (als de browser dat kan)
    store.set('devName', d.name || '');
    try {
      device.addEventListener('gattserverdisconnected', scheduleRetry);
      wantConnected = true;
      stopDemo();
      s.source = 'ble';
      s.distanceOffset = null;
      s.carry = 0;
      s.strokes = null;
      s.elapsed = 0;
      newSess();
      await connectGatt();
      keepAwake();
    } catch (e) {
      if (e && e.name === 'NotFoundError') { if (!wantConnected) setConn('off', 'Verbinden met de roeier'); return; }
      if (wantConnected) scheduleRetry();
      else { setConn('off', 'Verbinden met de roeier'); hint('Verbinden lukte niet. Probeer het nog eens.'); }
    }
  }

  // Bij openen meteen verbinden met de roeier van de vorige keer (alleen als de browser getDevices kent)
  async function autoConnect() {
    if (!navigator.bluetooth || !navigator.bluetooth.getDevices || !store.get('auto', false)) return;
    try {
      const ds = await navigator.bluetooth.getDevices();
      const d = ds.find(x => x.name && x.name === store.get('devName', '')) || ds[0];
      if (d) await useDevice(d);
    } catch (e) {}
  }

  function disconnect() {
    store.set('auto', false);
    wantConnected = false;
    clearTimeout(retryTimer);
    try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (e) {}
    if (s.source === 'ble') s.source = null;
    setConn('off', 'Verbinden met de roeier');
    render();
  }

  // ---------- Demo ----------
  const demo = (() => {
    let timer = null, t0 = 0, dist = 0, count = 0;
    function stroke() {
      const t = (performance.now() - t0) / 1000;
      // Tempo schommelt rustig rond het doel, met af en toe een uitschieter
      const spm = Math.max(14, Math.min(38, s.goal + 3.2 * Math.sin(t / 9) + 1.6 * Math.sin(t / 3.1) + (Math.random() - .5)));
      const pace = Math.max(95, 150 - (spm - 20) * 2.2 + (Math.random() - .5) * 4); // s per 500 m
      const interval = 60 / spm;
      dist += 500 / pace * interval;
      onData({ spm: Math.round(spm * 2) / 2, strokes: ++count, distance: dist, pace: Math.round(pace) });
      timer = setTimeout(stroke, interval * 1000);
    }
    return {
      start() { t0 = performance.now(); dist = 0; count = 0; s.strokes = 0; s.distanceOffset = 0; s.distance = 0; s.elapsed = 0; newSess(); stroke(); },
      stop() { clearTimeout(timer); timer = null; },
      reset() { dist = 0; s.distance = 0; s.distanceOffset = 0; }
    };
  })();

  function setDemoButtons(on) {
    all('[data-act="demo"]').forEach(b => b.setAttribute('aria-checked', String(on)));

  }

  function stopDemo() {
    demo.stop();
    setDemoButtons(false);

  }

  function toggleDemo() {
    if (s.source === 'demo') { stopDemo(); render(); return; }
    if (wantConnected) { hint('Verbreek eerst de verbinding met de roeier.'); return; }
    s.source = 'demo';
    setDemoButtons(true);
    demo.start();
    keepAwake();
    hint('De demo staat aan: er komen nagebootste slagen binnen. Uitzetten kan bij Instellingen.');
  }

  // ---------- Zwevende balk (Picture-in-Picture van een canvas) ----------
  const pip = (() => {
    const cv = document.getElementById('pipCanvas'), vid = document.getElementById('pipVideo');
    const g = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const FONT = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
    const HEX = { ok: '#30d158', slow: '#ff9f0a', fast: '#ff453a', idle: '#4a525c' };
    let ready = false, tickFlip = false;

    // De balk: 420 x 64 punten, getekend op dubbele resolutie
    function draw(st, active) {
      if (!g) return;
      lastArgs = [st, active];
      g.setTransform(2, 0, 0, 2, 0, 0);
      const BW = W / 2, BH = H / 2, col = HEX[st.key];
      g.fillStyle = '#111418'; g.fillRect(0, 0, BW, BH);
      g.textBaseline = 'alphabetic';

      // Links: tempo nu (kleur = op tempo, te langzaam of te snel), het doel en daaronder de aanwijzing
      let x = 16;
      g.font = `700 30px ${FONT}`; g.fillStyle = active ? col : '#5d6773';
      const now = active ? String(Math.round(s.spm)) : '--';
      g.fillText(now, x, 36); x += g.measureText(now).width + 3;
      g.font = `600 16px ${FONT}`; g.fillStyle = '#c9ced4';
      g.fillText('/ ' + s.goal, x, 36);
      // In de laatste 5 tellen van een blok: aankondiging van het volgende tempo
      const pi = progInfo(), soon = pi && pi.next && pi.rem <= 5;
      g.font = `600 11px ${FONT}`;
      if (soon) { g.fillStyle = '#30d158'; g.fillText(`Zo naar ${pi.next.spm} (${Math.ceil(pi.rem)})`, 17, 53); }
      else { g.fillStyle = active ? col : '#7d8793'; g.fillText(st.text, 17, 53); }

      // Scheidingslijntjes en het roeiertje, of even een korte melding (na een knop in het zwevende venster)
      g.fillStyle = '#262c34'; g.fillRect(124, 14, 1, 36); g.fillRect(290, 14, 1, 36);
      if (s.flash && performance.now() < s.flash.until) {
        g.font = `600 15px ${FONT}`; g.fillStyle = '#f2f4f6'; g.textAlign = 'center';
        g.fillText(s.flash.text, 207, 37); g.textAlign = 'left';
      } else drawRower(g, 134, 6, 146, 52, beatPhase());

      // Onderin: de hele training in gekleurde stukken (per blok), gedeeld = al geroeid
      if (pi) {
        const steps = s.prog.steps, tot = steps.reduce((a, b) => a + b.sec, 0), gap = 1.5;
        let sx = 0;
        steps.forEach((st2, i) => {
          const w = BW * st2.sec / tot, c = segColor(st2.spm, steps), ww = Math.max(1, w - (i < steps.length - 1 ? gap : 0));
          g.globalAlpha = .28; g.fillStyle = c; g.fillRect(sx, BH - 4, ww, 4);
          g.globalAlpha = 1;
          const f = i < pi.idx ? 1 : i === pi.idx ? pi.frac : 0;
          if (f > 0) g.fillRect(sx, BH - 4, ww * f, 4);
          sx += w;
        });
      }

      // Rechts: afstand en tijd, met een schema daaronder het blok en de resterende tijd
      g.textAlign = 'right';
      const ty = pi ? 33 : 38;
      const t = fmtTime(s.elapsed / 1000);
      g.font = `500 13px ${FONT}`; g.fillStyle = '#8a94a1';
      g.fillText(t, BW - 16, ty);
      const tw = g.measureText(t).width;
      g.font = `650 17px ${FONT}`; g.fillStyle = '#f2f4f6';
      g.fillText(meters().toLocaleString('nl-NL') + ' m', BW - 16 - tw - 10, ty);
      if (pi) {
        g.font = `600 11px ${FONT}`; g.fillStyle = '#c9ced4';
        g.fillText(`Blok ${pi.idx + 1}/${pi.n}, nog ${fmtTime(pi.rem)}`, BW - 16, 51);
      }
      g.textAlign = 'left';
      g.setTransform(1, 0, 0, 1, 0, 0);

      tickFlip = !tickFlip; g.fillStyle = tickFlip ? '#111418' : '#121519'; g.fillRect(0, H - 1, 1, 1);
    }

    function setup() {
      if (ready) return true;
      if (!cv.captureStream) return false;
      vid.srcObject = cv.captureStream(20);
      vid.play().catch(() => {});
      ready = true;
      return true;
    }

    function isOn() {
      return document.pictureInPictureElement === vid || vid.webkitPresentationMode === 'picture-in-picture';
    }

    function setButtons() {
      const on = isOn();
      all('[data-act="pip"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    }
    vid.addEventListener('enterpictureinpicture', setButtons);
    vid.addEventListener('leavepictureinpicture', setButtons);
    vid.addEventListener('webkitpresentationmodechanged', setButtons);

    let pending = false;
    const info = () => `(technisch: rs=${vid.readyState} b=${vid.videoWidth} p=${vid.paused ? 1 : 0} api=${vid.webkitSetPresentationMode ? 'wk' : ''}${vid.requestPictureInPicture ? 'std' : ''})`;

    function checkLater(quiet) {
      setTimeout(() => {
        pending = false;
        setButtons();
        if (isOn()) close();
        else if (!quiet) hint('De zwevende balk kwam niet op gang ' + info());
      }, quiet ? 1500 : 2500);
    }

    const wrap = document.getElementById('pipWrap');
    const close = () => wrap.classList.remove('show');

    // Knop: eerst de balk zichtbaar tonen; iPadOS laat het zwevende venster uit een zichtbare video groeien
    function toggle() {
      if (!setup()) { hint('Deze browser kan geen zwevende balk maken.'); return; }
      if (isOn()) {
        if (vid.webkitSetPresentationMode) vid.webkitSetPresentationMode('inline');
        else if (document.exitPictureInPicture) document.exitPictureInPicture();
        return;
      }
      if (vid.paused) vid.play().catch(() => {});
      // Meteen zichtbaar (zonder overgang) en in dezelfde tik proberen te laten zweven; lukt dat niet, dan blijft de balk staan om op te tikken
      wrap.style.transition = 'none'; wrap.classList.add('show'); void wrap.offsetWidth; wrap.style.transition = '';
      if (!pending && vid.readyState >= 1 && vid.webkitSupportsPresentationMode && vid.webkitSupportsPresentationMode('picture-in-picture')) {
        pending = true;
        try { vid.webkitSetPresentationMode('picture-in-picture'); } catch (e) {}
        checkLater(true);
      }
    }

    // Tik op de zichtbare balk: nu echt laten zweven
    function start() {
      if (pending) { hint('De zwevende balk wordt nog gestart, even geduld.'); return; }
      try {
        if (vid.paused) vid.play().catch(() => {});
        if (vid.readyState < 1) { hint('De balk is nog niet klaar. Probeer het over een paar tellen opnieuw ' + info()); return; }
        pending = true;
        if (vid.webkitSupportsPresentationMode && vid.webkitSupportsPresentationMode('picture-in-picture')) {
          vid.webkitSetPresentationMode('picture-in-picture');
          checkLater();
        } else if (vid.requestPictureInPicture) {
          vid.requestPictureInPicture()
            .then(() => { pending = false; setButtons(); close(); })
            .catch(e => { pending = false; hint('Zwevende balk lukte niet: ' + (e && e.message ? e.message : 'onbekende fout') + ' ' + info()); });
        } else {
          pending = false;
          hint('Deze browser kan geen zwevende balk maken.');
        }
      } catch (e) { pending = false; hint('Zwevende balk lukte niet: ' + e.message + ' ' + info()); }
    }
    vid.addEventListener('click', start);
    setup();   // video alvast laten lopen, zodat één tik genoeg kan zijn

    // Knoppen in het zwevende venster: terug/vooruit = doel lager/hoger, spelen/pauze = metronoom
    let lastToggle = 0;
    function toggleMetro() {
      const now = performance.now();
      if (now - lastToggle < 600) return;   // niet dubbel tellen
      lastToggle = now;
      setAudio(!s.audioOn);
      flash(s.audioOn ? 'Metronoom aan' : 'Metronoom uit');
      if (vid.paused) vid.play().catch(() => {});
    }
    if ('mediaSession' in navigator) {
      const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
      set('seekbackward', () => setGoal(s.goal - 1, true));
      set('seekforward', () => setGoal(s.goal + 1, true));
      set('previoustrack', () => setGoal(s.goal - 1, true));
      set('nexttrack', () => setGoal(s.goal + 1, true));
      set('play', toggleMetro);
      set('pause', toggleMetro);
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: 'Roeitempo' }); } catch (e) {}
    }
    // Pauzeert iPadOS de video zelf, dan alsnog de metronoom omzetten en de balk laten doorlopen
    vid.addEventListener('pause', () => { if (isOn()) toggleMetro(); });

    // Alvast klaarzetten, zodat de knop direct kan starten
    setup();
    let lastArgs = null;
    setInterval(() => { if (lastArgs && isOn()) draw(...lastArgs); }, 50);
    return { draw, toggle, close };
  })();

  // ---------- Ritme-tegel: roeiertje op het doeltempo ----------
  (() => {
    const cv = el.ritme, g = cv.getContext('2d');
    let w = 0, h = 0;
    const fit = () => {
      const r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1;
      w = r.width; h = r.height;
      cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
      g.setTransform(k, 0, 0, k, 0, 0);
    };
    if (window.ResizeObserver) new ResizeObserver(fit).observe(cv); else window.addEventListener('resize', fit);
    fit();
    const frame = () => {
      if (document.visibilityState === 'visible' && w > 0 && h > 0) {
        g.clearRect(0, 0, w, h);
        const bh = Math.min(h, w / 1.9, 200);   // niet groter dan nodig
        drawRower(g, 0, (h - bh) / 2, w, bh, beatPhase());
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  })();

  // ---------- Schema's ----------
  const PRESETS = [
    { id: 'vrij', name: 'Vrij roeien', note: 'Geen schema; je stelt het doel zelf in.', reps: 1, blocks: [] },
    { id: 'vers', name: 'Rustig met versnellingen', note: '5 keer: 4 minuten op 20, 1 minuut op 26.', reps: 5, blocks: [{ sec: 240, spm: 20 }, { sec: 60, spm: 26 }] },
    { id: 'pir', name: 'Piramide', note: 'Steeds 2 minuten op 20, 22, 24, 26, 24, 22 en 20.', reps: 1, blocks: [20, 22, 24, 26, 24, 22, 20].map(spm => ({ sec: 120, spm })) },
    { id: 'fel', name: 'Kort en fel', note: '8 keer: 1 minuut op 28, 1 minuut op 20.', reps: 8, blocks: [{ sec: 60, spm: 28 }, { sec: 60, spm: 20 }] },
    { id: 'eigen', name: 'Eigen schema', note: 'Stel zelf de blokken samen.', reps: 1, blocks: [] }
  ];
  let own = store.get('eigen', { parts: [{ reps: 3, blocks: [{ sec: 180, spm: 22 }, { sec: 60, spm: 26 }] }] });
  if (!own.parts) own = { parts: [{ reps: own.reps || 1, blocks: own.blocks || [] }] };   // oude opslag
  const saveOwn = () => store.set('eigen', own);
  let picked = store.get('schema', 'vrij');
  if (picked === 'plan' && !store.get('plan', null)) picked = 'vrij';

  const partsOf = pr => pr.parts || [{ reps: pr.reps, blocks: pr.blocks }];
  const expand = pr => { const out = []; partsOf(pr).forEach(pt => { for (let r = 0; r < pt.reps; r++) pt.blocks.forEach(b => out.push({ sec: b.sec, spm: b.spm })); }); return out; };
  let plan = store.get('plan', null);   // { sessions: [{ title, parts }], next, done: [index] }
  const savePlan = () => store.set('plan', plan);
  const planName = i => `Training ${i + 1} van ${plan.sessions.length}`;
  const presetById = id => id === 'eigen' ? { ...PRESETS[4], parts: own.parts }
    : id === 'plan' && plan ? { id: 'plan', name: planName(plan.next), parts: plan.sessions[plan.next].parts }
    : PRESETS.find(p => p.id === id) || PRESETS[0];

  // Schema als tekst: elke regel een deel, bv. "5 min op 20" of "5 keer: 4 min op 22, 1 min op 26"
  // Elke regel met een tijd is een deel; een regel zonder tijd (bv. "Training 3") begint een nieuwe training
  const HASTIME = /\d+:\d{2}|\d\s*(?:minuten|minuut|min|m(?![a-z])|'|seconden|sec|s(?![a-z])|")/;
  function parseSchema(text) {
    const sessions = [], bad = [];
    let cur = null, newNext = false;
    const open = title => {
      if (cur && !cur.parts.length && title) { cur.title = cur.title ? cur.title + ', ' + title : title; return; }   // "Week 2" + "Training 1"
      cur = { title, parts: [] }; sessions.push(cur);
    };
    text.split(/\n/).forEach((raw, li) => {
      const clean = raw.replace(/^\s*(?:[-*•#]+|\d+[.)])\s+/, '').replace(/\*\*/g, '').trim();   // opsommingstekens en vet weg
      if (!clean) { if (cur && cur.parts.length) newNext = true; return; }
      let line = clean.toLowerCase();
      if (!HASTIME.test(line)) { open(clean.replace(/[:\s]+$/, '').slice(0, 60)); newNext = false; return; }
      const hm = line.match(/^((?:training|sessie|dag|workout|les|week)\s*\d+[^:]*?)\s*[:–-]\s+/);
      if (hm) { if (cur && cur.parts.length) cur = null; open(clean.slice(0, hm[1].length)); newNext = false; line = line.slice(hm[0].length); }
      if (!cur || newNext) { cur = null; open(''); newNext = false; }
      let reps = 1;
      const rm = line.match(/^(\d+)\s*(?:x|×|keer|maal)\s*:?\s*/);
      if (rm) { reps = +rm[1]; line = line.slice(rm[0].length); }
      line = line.replace(/^\(|\)$/g, '');
      const blocks = [];
      let ok = true;
      line.split(/,|;|\/|\+|\ben\b|\bthen\b|\bdaarna\b/).map(x => x.trim()).filter(Boolean).forEach(item => {
        let sec = null, rest = item, m;
        if ((m = rest.match(/(\d+):(\d{2})/))) sec = +m[1] * 60 + +m[2];
        else if ((m = rest.match(/(\d+(?:[.,]\d+)?)\s*(minuten|minuut|min|m(?![a-z])|')/))) { const v = parseFloat(m[1].replace(',', '.')); if (m[2] === 'm' && v >= 100) { ok = false; return; } sec = Math.round(v * 60); }
        else if ((m = rest.match(/(\d+)\s*(seconden|sec|s(?![a-z])|")/))) sec = +m[1];
        if (m) rest = rest.replace(m[0], ' ');
        const sm = rest.match(/(?:^|\D)(\d{2})(?!\d)/);
        const spm = sm ? +sm[1] : null;
        if (!sec || !spm || spm < GOAL_MIN || spm > GOAL_MAX || sec > 3600) { ok = false; return; }
        blocks.push({ sec, spm });
      });
      if (!ok || !blocks.length || reps < 1 || reps > 30) bad.push(`Regel ${li + 1} begrijp ik niet: ${raw.trim()}`);
      else cur.parts.push({ reps, blocks });
    });
    const skip = sessions.filter(se => !se.parts.length).map(se => se.title);   // losse tekst zonder tijd, bv. een opmerking
    return { sessions: sessions.filter(se => se.parts.length), bad, skip };
  }
  const describePart = pt => (pt.reps > 1 ? `${pt.reps} keer: ` : '') + pt.blocks.map(b => `${fmtTime(b.sec)} min op ${b.spm}`).join(', ');
  const totalSec = steps => steps.reduce((a, b) => a + b.sec, 0);

  function progInfo() {
    const pr = s.prog; if (!pr) return null;
    const t = Math.max(0, (s.elapsed - pr.start) / 1000);
    let acc = 0;
    for (let i = 0; i < pr.steps.length; i++) {
      const st = pr.steps[i];
      if (t < acc + st.sec) return { idx: i, n: pr.steps.length, rem: acc + st.sec - t, frac: (t - acc) / st.sec, next: pr.steps[i + 1] || null };
      acc += st.sec;
    }
    return { idx: pr.steps.length, n: pr.steps.length, rem: 0, frac: 1, next: null, done: true };
  }

  function progTick() {
    const pi = progInfo(); if (!pi) return;
    if (pi.done) {
      const pr = s.prog;
      s.prog = null;
      flash('Schema klaar');
      if (pr.id === 'plan' && plan && pr.planIdx < plan.sessions.length) {
        if (!plan.done.includes(pr.planIdx)) plan.done.push(pr.planIdx);
        const all = plan.done.length >= plan.sessions.length;
        plan.next = Math.min(plan.sessions.length - 1, pr.planIdx + 1); savePlan();
        hint(all ? 'Je hebt alle trainingen van het plan gedaan. Tik op Afronden om de training te bewaren.' : `${planName(pr.planIdx)} is klaar. Tik op Afronden om hem te bewaren; de volgende keer staat training ${pr.planIdx + 2} klaar.`);
      } else hint('Het schema is klaar. Tik op Afronden om de training te bewaren.');
      return;
    }
    if (pi.idx !== s.prog.idx) {
      s.prog.idx = pi.idx;
      setGoal(s.prog.steps[pi.idx].spm, true);
    }
  }

  function startProg(id) {
    const pr = presetById(id);
    picked = id; store.set('schema', id);
    const steps = expand(pr);
    if (id === 'vrij' || !steps.length) { s.prog = null; render(); return; }
    s.prog = { id, name: pr.name, steps, start: s.elapsed, idx: 0, planIdx: id === 'plan' ? plan.next : null };
    setGoal(s.prog.steps[0].spm, true);
    hint(`${id === 'eigen' ? 'Je eigen schema' : id === 'plan' ? pr.name : 'Schema ' + pr.name} is gestart: ${s.prog.steps.length} blokken, samen ${fmtTime(totalSec(s.prog.steps))} roeien.`);
  }

  // ---------- Overzicht en eerdere trainingen ----------
  const history = { get: () => store.get('trainingen', []), add(t) { const h = this.get(); h.unshift(t); store.set('trainingen', h.slice(0, 200)); },
    del(i) { const h = this.get(); h.splice(i, 1); store.set('trainingen', h); } };

  function summary() {
    const ss = s.sess, m = meters(), sec = s.elapsed / 1000;
    return {
      date: ss.startedAt || new Date().toISOString(), meters: m, sec,
      spm: ss.activeMs ? ss.spmMs / ss.activeMs : 0,
      pace: m > 0 ? sec / m * 500 : 0,
      onTarget: ss.activeMs ? Math.round(ss.onTargetMs / ss.activeMs * 100) : 0,
      strokes: ss.strokes, schema: s.prog ? s.prog.name : (picked !== 'vrij' ? presetById(picked).name : '')
    };
  }

  const fmtDate = iso => { try { return new Date(iso).toLocaleString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const nlNum = (v, d = 0) => v.toLocaleString('nl-NL', { minimumFractionDigits: d, maximumFractionDigits: d });

  // ---------- Paneel ----------
  const sheet = document.getElementById('sheet'), panel = document.getElementById('panel');
  let view = null, lastSum = null, pasteText = '';
  function openSheet(v) { view = v; sheet.hidden = false; drawSheet(); recShow(); }
  function closeSheet() { sheet.hidden = true; view = null; }
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });

  function drawSheet() {
    if (view === 'training') {
      const running = s.prog ? `<div class="row"><p>Nu bezig: <b>${s.prog.name}</b>, blok ${Math.min(s.prog.idx + 1, s.prog.steps.length)} van ${s.prog.steps.length}.</p><button type="button" class="btn small" data-act="progstop">Stoppen</button></div>` : '';
      const stepper = (pi, i, f, d, label, val, unit) => `<span class="mini"><button type="button" data-act="ed" data-p="${pi}" data-i="${i}" data-f="${f}" data-d="${-d}" aria-label="${label[0]}">&minus;</button><span class="v">${val}<small>${unit}</small></span><button type="button" data-act="ed" data-p="${pi}" data-i="${i}" data-f="${f}" data-d="${d}" aria-label="${label[1]}">+</button></span>`;
      const nBlocks = own.parts.reduce((a, pt) => a + pt.blocks.length, 0);
      const editor = picked === 'eigen' ? `<div class="ed">
          <div class="sum1">Samen ${fmtTime(totalSec(expand(presetById('eigen'))))} roeien</div>
          ${own.parts.map((pt, pi) => `<div class="part">
            ${pt.blocks.map((b, i) => `<div class="blk"><div class="head"><span>Blok ${i + 1}</span>${nBlocks > 1 ? `<button type="button" class="del" data-act="eddel" data-p="${pi}" data-i="${i}">Weghalen</button>` : ''}</div>
              ${stepper(pi, i, 'sec', 30, ['Korter', 'Langer'], fmtTime(b.sec), 'minuten')}
              ${stepper(pi, i, 'spm', 1, ['Lager tempo', 'Hoger tempo'], b.spm, 'slagen per minuut')}</div>`).join('')}
            <div class="partfoot"><button type="button" class="btn small" data-act="edadd" data-p="${pi}">Blok toevoegen</button>
              <span class="mini"><button type="button" data-act="edreps" data-p="${pi}" data-d="-1" aria-label="Minder keer">&minus;</button><span class="v">${pt.reps} keer</span><button type="button" data-act="edreps" data-p="${pi}" data-d="1" aria-label="Meer keer">+</button></span></div>
          </div>`).join('')}
          <p>Elk deel roei je het aantal keer dat erbij staat, daarna begint het volgende deel.</p>
          <button type="button" class="linkbtn" data-act="edpart">Deel toevoegen</button>
        </div>` : '';
      const planChoice = plan ? `<button type="button" class="choice" data-act="pick" data-id="plan" aria-pressed="${picked === 'plan'}"><b>Plan: ${planName(plan.next).toLowerCase()}</b><span>${plan.sessions[plan.next].title && !/^(training|sessie|dag|workout|les)\s*\d+$/i.test(plan.sessions[plan.next].title) ? plan.sessions[plan.next].title + '. ' : ''}${plan.sessions[plan.next].parts.map(describePart).join('; ')}</span></button>` : '';
      const planBox = plan && picked === 'plan' ? `<div class="ed">
          <div class="partfoot"><span>${plan.done.length} van de ${plan.sessions.length} gedaan</span>
            <span class="mini"><button type="button" data-act="plannav" data-d="-1" aria-label="Vorige training">&minus;</button><span class="v">Training ${plan.next + 1}${plan.done.includes(plan.next) ? ' (gedaan)' : ''}</span><button type="button" data-act="plannav" data-d="1" aria-label="Volgende training">+</button></span></div>
          <p>Heb je een training helemaal geroeid, dan staat de volgende vanzelf klaar.</p>
          <button type="button" class="del" data-act="plandel">Plan weghalen</button>
        </div>` : '';
      const again = s.prog && s.prog.id === picked && (picked !== 'plan' || s.prog.planIdx === plan.next);
      panel.innerHTML = `<h2>Training</h2>${running}
        <div class="sec">
          ${planChoice}${planBox}
          ${PRESETS.map(p => `<button type="button" class="choice" data-act="pick" data-id="${p.id}" aria-pressed="${picked === p.id}"><b>${p.name}</b><span>${p.note}</span></button>${p.id === 'eigen' ? editor : ''}`).join('')}
          <button type="button" class="linkbtn" data-act="paste">Schema of plan plakken</button>
        </div>
        <div class="btns foot">
          <button type="button" class="btn primary" data-act="progstart">${picked === 'vrij' ? 'Vrij roeien' : again ? 'Opnieuw beginnen' : 'Starten'}</button>
          <button type="button" class="btn" data-act="sheetclose">Sluiten</button>
        </div>`;
    } else if (view === 'settings') {
      const n = history.get().length;
      panel.innerHTML = `<h2>Instellingen</h2>
        <div class="sec"><div class="lbl">Trainingen</div>
          <p>${n ? `Je hebt ${n === 1 ? '1 training' : n + ' trainingen'} bewaard op dit apparaat.` : 'Je hebt nog geen trainingen bewaard.'}</p>
          <div class="btns"><button type="button" class="btn" data-act="hist">Eerdere trainingen</button></div>
        </div>
        ${roeierSection()}
        ${recSection()}
        <div class="sec"><div class="lbl">Demo</div>
          <div class="row"><p>Nagebootste slagen, om alles uit te proberen zonder te roeien.</p><button class="switch" data-act="demo" type="button" role="switch" aria-checked="${s.source === 'demo'}" aria-label="Demo"></button></div>
        </div>
        <div class="btns foot"><button type="button" class="btn primary" data-act="sheetclose">Sluiten</button></div>`;
    } else if (view === 'paste') {
      panel.innerHTML = `<h2>Schema of plan plakken</h2>
        <p>Zet elk deel op een eigen regel, met de tijd en het tempo in slagen per minuut. Wil je een deel een paar keer herhalen, zet dan het aantal keer ervoor. Bijvoorbeeld:</p>
        <pre>5 min op 20
5 keer: 4 min op 22, 1 min op 26
5 min op 18</pre>
        <p>Wil je een heel plan in een keer invoeren, bijvoorbeeld 20 trainingen, zet dan boven elke training een regel met alleen de naam, zoals Training 1. De app onthoudt welke training de volgende is. Afstanden (zoals 500 m) werken nog niet, alleen tijden.</p>
        <textarea id="pasteBox" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Plak of typ hier je schema">${pasteText.replace(/</g, '&lt;')}</textarea>
        <div class="sec"><div class="lbl">Zo lees ik het</div><div id="readout"></div></div>
        <div class="btns foot">
          <button type="button" class="btn primary" data-act="pastesave" id="pasteSave">Bewaren</button>
          <button type="button" class="btn" data-act="training">Terug</button>
        </div>`;
      const box = document.getElementById('pasteBox');
      const show = () => {
        const r = parseSchema(pasteText), ro = document.getElementById('readout'), many = r.sessions.length > 1, esc = x => x.replace(/</g, '&lt;');
        ro.innerHTML = !pasteText.trim() ? '<p>Nog niets ingevuld.</p>' : `<div class="readout">
          ${r.sessions.map((se, i) => `<div>${many ? `<b>${esc(se.title || 'Training ' + (i + 1))}</b> (${fmtTime(totalSec(expand(se)))}): ` : ''}${se.parts.map(describePart).join('; ')}</div>`).join('')}
          ${r.bad.map(b => `<div class="bad">${esc(b)}</div>`).join('')}
          ${r.skip.length ? `<p>Deze tekst sla ik over, want er staat geen tijd in: ${esc(r.skip.join('; '))}</p>` : ''}
          ${r.sessions.length === 1 ? `<div>Samen ${fmtTime(totalSec(expand(r.sessions[0])))} roeien.</div>` : ''}</div>`;
        document.getElementById('pasteSave').textContent = many ? `Bewaren als plan van ${r.sessions.length} trainingen` : 'Bewaren als eigen schema';
      };
      box.addEventListener('input', () => { pasteText = box.value; show(); });
      show();
    } else if (view === 'summary') {
      const t = lastSum, asking = !t.saved;
      panel.innerHTML = `<h2>${asking ? 'Training bewaren?' : 'Training bewaard'}</h2><p>${fmtDate(t.date)}${t.schema ? ', ' + t.schema : ''}</p>
        <div class="sum">
          <div><div class="lbl">Afstand</div><div class="v">${nlNum(t.meters)} m</div></div>
          <div><div class="lbl">Tijd</div><div class="v">${fmtTime(t.sec)}</div></div>
          <div><div class="lbl">Gemiddeld tempo</div><div class="v">${nlNum(t.spm, 1)}</div></div>
          <div><div class="lbl">Gemiddeld per 500 m</div><div class="v">${t.pace ? fmtTime(t.pace) : '-:--'}</div></div>
          <div><div class="lbl">Op tempo</div><div class="v">${t.onTarget}%</div></div>
          <div><div class="lbl">Slagen</div><div class="v">${nlNum(t.strokes)}</div></div>
        </div>
        ${asking ? `<p>Bewaar je de training, dan staat hij bij Eerdere trainingen. In beide gevallen gaan afstand en tijd daarna weer op nul. Sluit je dit venster, dan roei je gewoon verder met deze training.</p>
        <div class="btns"><button type="button" class="btn" data-act="nosave">Niet bewaren</button><button type="button" class="btn primary" data-act="save">Bewaren</button></div>`
        : `<div class="btns"><button type="button" class="btn" data-act="fit" data-i="last">Naar HealthFit</button><button type="button" class="btn" data-act="hist">Eerdere trainingen</button><button type="button" class="btn primary" data-act="sheetclose">Klaar</button></div>`}`;
    } else if (view === 'hist') {
      const h = history.get();
      panel.innerHTML = `<h2>Eerdere trainingen</h2>
        ${h.length ? `<div class="hist">${h.map((t, i) => `<div><b>${nlNum(t.meters)} m in ${fmtTime(t.sec)}</b><span class="d">${fmtDate(t.date)}, gemiddeld ${nlNum(t.spm, 1)} slagen, ${t.onTarget}% op tempo${t.schema ? ', ' + t.schema : ''}</span><span class="acts"><button type="button" class="del fit" data-act="fit" data-i="${i}">${t.fit ? 'Nog een keer naar HealthFit' : 'Naar HealthFit'}</button><button type="button" class="del" data-act="histdel" data-i="${i}">Weghalen</button></span></div>`).join('')}</div>`
          : '<p>Je hebt nog geen trainingen bewaard. Rond een training af met de blauwe knop Afronden bovenin, dan staat hij hier.</p>'}
        <p>Deze lijst staat alleen op dit apparaat, in deze browser. Met Naar HealthFit deel je een training als bestand: kies HealthFit in het deelmenu, of bewaar het bestand in de map die HealthFit leest in Dropbox of Google Drive. HealthFit zet de training dan als roeitraining in Apple Gezondheid.</p>
        <div class="btns"><button type="button" class="btn" data-act="settings">Terug</button><button type="button" class="btn primary" data-act="sheetclose">Sluiten</button></div>`;
    }
  }

  function roeierSection() {
    const step = (act, val, unit, lbl) => `<span class="mini"><button type="button" data-act="${act}" data-d="-1" aria-label="${lbl[0]}">&minus;</button><span class="v">${val}<small>${unit}</small></span><button type="button" data-act="${act}" data-d="1" aria-label="${lbl[1]}">+</button></span>`;
    return `<div class="sec"><div class="lbl">Roeier</div>
      <div class="row"><p>Stand van de draaiknop op de R30</p>${step('stand', stand, 'van 8', ['Lichtere stand', 'Zwaardere stand'])}</div>
      <p>Zet hier dezelfde stand als op de draaiknop. Een zwaardere stand telt dan als meer meters per slag.</p>
      <div class="row"><p>Afstand per slag</p>${step('ijk', Math.round(ijk * 100) + '%', 'van de schatting', ['Minder afstand', 'Meer afstand'])}</div>
      <p>De R30 meet zelf geen afstand, dus de meters zijn een schatting. Vind je je tempo per 500 m te snel of te langzaam, stel het dan hier bij. Dit geldt vanaf de volgende slag.</p>
    </div>`;
  }
  function recSection() {
    let body;
    if (rec.on) body = `<p>De opname loopt: <b id="recN"></b>. Roei ongeveer 2 minuten zo gelijkmatig als je kunt. Stop daarna 10 seconden met roeien en laat het vliegwiel uitlopen. Stop dan de opname.</p>
      <div class="btns"><button type="button" class="btn primary" data-act="recstop">Opname stoppen</button></div>`;
    else if (rec.start) body = `<p>De opname is klaar: <b id="recN"></b>. Stuur hem naar de Mac met Delen (bijvoorbeeld via AirDrop), of kopieer hem.</p>
      <div class="btns"><button type="button" class="btn primary" data-act="recshare">Delen</button><button type="button" class="btn" data-act="reccopy">Kopiëren</button></div>
      <button type="button" class="btn small" data-act="recstart">Opnieuw opnemen</button>`;
    else if (s.source !== 'ble') body = '<p>Maak eerst verbinding met de roeier. Daarna kun je hier een opname maken.</p>';
    else body = `<p>Met een opname van het vliegwiel kan de roeier beter worden afgesteld, zodat tempo en afstand kloppen.</p>
      ${rec.err ? `<p><b>${rec.err}</b></p><p>Lukt het steeds niet, kies de roeier dan opnieuw: sluit dit venster, tik op de Bluetooth-knop om de verbinding te verbreken en tik er daarna nog een keer op.</p>` : ''}
      <div class="btns"><button type="button" class="btn" data-act="recstart">Opname starten</button></div>`;
    return `<div class="sec"><div class="lbl">Afstellen</div>${body}</div>`;
  }
  function recText() {
    return JSON.stringify({ app: 'roeitempo', device: device && device.name, start: rec.start,
      uitleg: 'rows: [ms, spm, slagen, afstand m, s per 500 m]; ext: [ms, vermogen W, haal s, terug s, dragfactor]; dt: microseconden per impuls; dtAt: [ms, aantal dt tot dan]',
      rows: rec.rows, ext: rec.ext, dtAt: rec.dtAt, dt: rec.dt });
  }
  function recName() { const d = new Date(rec.start || Date.now()), z = n => String(n).padStart(2, '0'); return `roei-opname-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.txt`; }

  // ---------- FIT-bestand (voor HealthFit / Apple Gezondheid) ----------
  const FIT_CRC = [0x0000, 0xCC01, 0xD801, 0x1400, 0xF001, 0x3C00, 0x2800, 0xE401, 0xA001, 0x6C00, 0x7800, 0xB401, 0x5000, 0x9C01, 0x8801, 0x4400];
  function fitCrc(bytes, crc = 0) {
    for (const b of bytes) {
      let tmp = FIT_CRC[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ tmp ^ FIT_CRC[b & 0xF];
      tmp = FIT_CRC[crc & 0xF]; crc = (crc >> 4) & 0x0FFF; crc = crc ^ tmp ^ FIT_CRC[(b >> 4) & 0xF];
    }
    return crc;
  }
  function fitFile(t) {
    const SIZE = { 0x00: 1, 0x02: 1, 0x84: 2, 0x86: 4, 0x8C: 4 };
    const out = [];
    const put = (v, type) => { for (let i = 0; i < SIZE[type]; i++) out.push((v >>> (8 * i)) & 0xff); };
    let local = 0;
    // Elk bericht: eigen lokale nummer, definitie + gegevens. fields: [veldnummer, type, waarde]
    const msg = (global, fields) => {
      const l = local++ & 0x0f;
      out.push(0x40 | l, 0, 0, global & 0xff, global >> 8, fields.length);
      fields.forEach(([num, type]) => out.push(num, SIZE[type], type));
      out.push(l);
      fields.forEach(([, type, v]) => put(Math.max(0, Math.round(v)), type));
    };
    const start = new Date(t.date).getTime(), end = start + t.sec * 1000;
    const fitTime = ms => Math.floor(ms / 1000) - 631065600;   // seconden sinds 31 dec 1989
    const ts0 = fitTime(start), ts1 = fitTime(end);
    const speed = t.sec > 0 ? t.meters / t.sec : 0;
    const watts = Math.min(1500, 2.8 * speed ** 3);              // zelfde verband als Concept2 (begrensd)
    const kcal = (4 * 0.8604 * watts + 300) * t.sec / 3600;
    const ENUM = 0x00, U8 = 0x02, U16 = 0x84, U32 = 0x86, U32Z = 0x8C;
    msg(0, [[0, ENUM, 4], [1, U16, 255], [2, U16, 1], [3, U32Z, 30], [4, U32, ts0]]);                       // file_id: activiteit
    msg(21, [[253, U32, ts0], [0, ENUM, 0], [1, ENUM, 0]]);                                                  // event: start
    msg(20, [[253, U32, ts0], [5, U32, 0], [4, U8, 0]]);                                                     // record: begin
    msg(20, [[253, U32, ts1], [5, U32, t.meters * 100], [4, U8, t.spm]]);                                    // record: eind
    msg(21, [[253, U32, ts1], [0, ENUM, 0], [1, ENUM, 4]]);                                                  // event: stop
    const totals = [[7, U32, t.sec * 1000], [8, U32, t.sec * 1000], [9, U32, t.meters * 100], [10, U32, t.strokes], [11, U16, kcal]];
    msg(19, [[253, U32, ts1], [2, U32, ts0], ...totals, [13, U16, speed * 1000], [17, U8, t.spm], [19, U16, watts], [0, ENUM, 9], [1, ENUM, 1], [25, ENUM, 15], [39, ENUM, 14]]);   // lap
    msg(18, [[253, U32, ts1], [2, U32, ts0], ...totals, [14, U16, speed * 1000], [18, U8, t.spm], [20, U16, watts], [5, ENUM, 15], [6, ENUM, 14], [25, U16, 0], [26, U16, 1], [0, ENUM, 8], [1, ENUM, 1]]);   // session: binnen roeien
    msg(34, [[253, U32, ts1], [0, U32, t.sec * 1000], [1, U16, 1], [2, ENUM, 0], [3, ENUM, 26], [4, ENUM, 1], [5, U32, ts1 - new Date(start).getTimezoneOffset() * 60]]);   // activity
    const header = [14, 0x10, 2132 & 0xff, 2132 >> 8, out.length & 0xff, (out.length >> 8) & 0xff, (out.length >> 16) & 0xff, out.length >>> 24, 0x2E, 0x46, 0x49, 0x54];
    const hc = fitCrc(header); header.push(hc & 0xff, hc >> 8);
    const all = header.concat(out), crc = fitCrc(all);
    all.push(crc & 0xff, crc >> 8);
    return new Uint8Array(all);
  }
  async function shareFit(t, idx) {
    if (!t) return;
    const d = new Date(t.date), z = n => String(n).padStart(2, '0');
    const file = new File([fitFile(t)], `roeien-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.fit`, { type: 'application/octet-stream' });
    let done = false;
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); done = true; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    if (!done) { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click(); done = true; }
    // Onthouden dat hij gedeeld is (bij Eerdere trainingen)
    const h = history.get(), i = idx === 'last' ? h.findIndex(x => x.date === t.date) : +idx;
    if (h[i]) { h[i].fit = true; store.set('trainingen', h); if (view === 'hist') keepScroll(() => {}); }
  }

  function autoFinish() {
    const t = summary(), saved = t.meters >= 10 || t.sec >= 30;
    if (saved) history.add(t);
    s.prog = null;
    resetSession(true);
    s.distanceOffset = null;   // nieuwe nulmeting bij de volgende afstand
    hint(saved ? 'Je vorige training is bewaard bij Eerdere trainingen. Deze begint weer bij 0.' : 'Nieuwe training: alles begint weer bij 0.');
  }

  function finish() {
    const t = summary();
    if (t.meters < 10 && t.sec < 30) { hint('Er is nog niet genoeg geroeid om af te ronden.'); return; }
    lastSum = t;
    openSheet('summary');
  }
  function endTraining(keep) {
    const t = summary();   // opnieuw, want er kan nog geroeid zijn terwijl de vraag openstond
    if (keep) { history.add(t); t.saved = true; lastSum = t; }
    s.prog = null;
    resetSession(true);
    if (keep) drawSheet();
    else { closeSheet(); hint('De training is niet bewaard. Afstand en tijd staan weer op nul.'); }
  }

  function editOwn(b) {
    const d = +b.dataset.d, f = b.dataset.f, bl = own.parts[+b.dataset.p].blocks[+b.dataset.i];
    if (f === 'sec') bl.sec = Math.max(30, Math.min(3600, bl.sec + d));
    else bl.spm = Math.max(GOAL_MIN, Math.min(GOAL_MAX, bl.spm + d));
    saveOwn();
  }
  function keepScroll(fn) { const y = panel.scrollTop; fn(); drawSheet(); recShow(); panel.scrollTop = y; }

  // ---------- Knoppen ----------
  const actions = {
    minus: () => setGoal(s.goal - 1),
    plus: () => setGoal(s.goal + 1),
    reset: () => resetSession(),
    zero: () => { if (confirm('Afstand en tijd op nul zetten? Deze training wordt dan niet bewaard.')) { s.prog = null; resetSession(); closeSheet(); } },
    audio: () => setAudio(!s.audioOn),
    demo: toggleDemo,
    pip: () => pip.toggle(),
    pipclose: () => pip.close(),
    training: () => openSheet('training'),
    settings: () => openSheet('settings'),
    sheetclose: closeSheet,
    pick: b => keepScroll(() => { picked = b.dataset.id; }),
    progstart: () => { startProg(picked); closeSheet(); },
    progstop: () => { s.prog = null; hint('Schema gestopt. Je roeit nu vrij verder.'); closeSheet(); render(); },
    finish,
    stand: b => keepScroll(() => { stand = Math.max(1, Math.min(8, stand + +b.dataset.d)); store.set('stand', stand); sendSettings(); }),
    ijk: b => keepScroll(() => { ijk = Math.max(0.5, Math.min(2, Math.round((ijk + 0.05 * +b.dataset.d) * 100) / 100)); store.set('ijk', ijk); sendSettings(); }),
    fit: b => shareFit(b.dataset.i === 'last' ? lastSum : history.get()[+b.dataset.i], b.dataset.i),
    recstart: async () => {
      rec.err = '';
      if (!(await recSubscribe())) { keepScroll(() => {}); return; }
      keepScroll(() => { Object.assign(rec, { on: true, t0: performance.now(), start: new Date().toISOString(), rows: [], ext: [], dt: [], dtAt: [] }); });
    },
    recstop: () => keepScroll(() => { rec.on = false; }),
    recshare: async () => {
      const file = new File([recText()], recName(), { type: 'text/plain' });
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
    },
    reccopy: async () => {
      try { await navigator.clipboard.writeText(recText()); hint('De opname is gekopieerd.'); }
      catch (e) { hint('Kopiëren lukte niet. Probeer Delen.'); }
    },
    save: () => endTraining(true),
    nosave: () => endTraining(false),
    histdel: b => { const t = history.get()[+b.dataset.i]; if (t && confirm(`De training van ${fmtDate(t.date)} (${nlNum(t.meters)} m) weghalen? Dat kan niet ongedaan worden.`)) keepScroll(() => history.del(+b.dataset.i)); },
    hist: () => openSheet('hist'),
    ed: b => keepScroll(() => editOwn(b)),
    eddel: b => keepScroll(() => { const pt = own.parts[+b.dataset.p]; pt.blocks.splice(+b.dataset.i, 1); if (!pt.blocks.length) own.parts.splice(+b.dataset.p, 1); saveOwn(); }),
    edadd: b => keepScroll(() => { const pt = own.parts[+b.dataset.p], l = pt.blocks[pt.blocks.length - 1] || { sec: 120, spm: 22 }; pt.blocks.push({ sec: l.sec, spm: l.spm }); saveOwn(); }),
    edreps: b => keepScroll(() => { const pt = own.parts[+b.dataset.p]; pt.reps = Math.max(1, Math.min(30, pt.reps + +b.dataset.d)); saveOwn(); }),
    edpart: () => keepScroll(() => { own.parts.push({ reps: 1, blocks: [{ sec: 300, spm: 20 }] }); saveOwn(); }),
    paste: () => {
      pasteText = picked === 'plan' && plan ? plan.sessions.map((se, i) => (se.title || 'Training ' + (i + 1)) + '\n' + se.parts.map(describePart).join('\n')).join('\n\n') : own.parts.map(describePart).join('\n');
      openSheet('paste');
    },
    pastesave: () => {
      const r = parseSchema(pasteText);
      if (r.bad.length || !r.sessions.length) { hint(r.sessions.length ? 'Pas eerst de regels aan die ik niet begrijp.' : 'Er staat nog geen schema in.'); return; }
      if (r.sessions.length === 1) { own = { parts: r.sessions[0].parts }; saveOwn(); picked = 'eigen'; }
      else {
        if (plan && plan.done.length && !confirm(`Je huidige plan vervangen? Je hebt daarvan ${plan.done.length} trainingen gedaan.`)) return;
        plan = { sessions: r.sessions, next: 0, done: [] }; savePlan(); picked = 'plan';
      }
      store.set('schema', picked); openSheet('training');
    },
    plannav: b => keepScroll(() => { plan.next = Math.max(0, Math.min(plan.sessions.length - 1, plan.next + +b.dataset.d)); savePlan(); }),
    plandel: () => { if (!confirm('Het plan weghalen? Je eerdere trainingen blijven bewaard.')) return; plan = null; store.set('plan', null); if (s.prog && s.prog.id === 'plan') s.prog = null; picked = 'vrij'; store.set('schema', 'vrij'); drawSheet(); render(); },
    conn: () => { if (wantConnected) { if (confirm('Verbinding met de roeier verbreken?')) disconnect(); } else connect(); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && actions[b.dataset.act]) actions[b.dataset.act](b);
  });

  // ---------- Melding ----------
  let hintTimer = null;
  function hint(text) {
    el.hint.textContent = text;
    el.hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => el.hint.classList.remove('show'), text.length > 70 ? 9000 : 3200);
  }

  setAudio(false);
  setConn('off', 'Verbinden met de roeier');
  render();
  autoConnect();
})();
</script>
</body>
</html>
