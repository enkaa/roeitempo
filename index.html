<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Roeitempo</title>
<style>
  :root {
    --bg: #0b0d10;
    --tile: #161a1f;
    --raise: #22282f;
    --line: #262c34;
    --text: #f2f4f6;
    --soft: #c9ced4;
    --muted: #7d8793;
    --ok: #30d158;
    --slow: #ff9f0a;
    --fast: #ff453a;
    --idle: #5d6773;
    --blue: #0a84ff;
    --state: var(--idle);
    --gap: clamp(8px, 1.6vmin, 14px);
    --r: clamp(12px, 2.4vmin, 20px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  body { display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; padding: 0; border: 0; background: none; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Tegels: breed venster = tempo links, rechts ritme, doel en metronoom, onderin de cijfers */
  .tiles { flex: 1; min-width: 0; min-height: 0; display: grid; gap: var(--gap);
    padding: max(var(--gap), env(safe-area-inset-top)) max(var(--gap), env(safe-area-inset-right)) max(var(--gap), env(safe-area-inset-bottom)) max(var(--gap), env(safe-area-inset-left));
    grid-template-columns: repeat(6, minmax(0, 1fr));
    grid-template-rows: auto minmax(0, 1fr) auto auto auto;
    grid-template-areas:
      "top top top top top top"
      "tempo tempo tempo ritme ritme ritme"
      "tempo tempo tempo doel doel doel"
      "tempo tempo tempo metro metro metro"
      "s1 s1 s2 s2 s3 s3"; }
  /* Staand venster: alles onder elkaar */
  @media (max-aspect-ratio: 1/1) {
    .tiles { grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      grid-template-areas:
        "top top top top top top"
        "tempo tempo tempo tempo tempo tempo"
        "ritme ritme ritme ritme ritme ritme"
        "doel doel doel metro metro metro"
        "s1 s1 s2 s2 s3 s3"; }
  }

  .top { grid-area: top; display: flex; justify-content: flex-end; align-items: center; gap: var(--gap); }   /* linksboven vrij voor de vensterknopjes */
  .tile { background: var(--tile); border-radius: var(--r); padding: clamp(10px, 2.2vmin, 18px); min-width: 0; min-height: 0; position: relative; }
  .lbl { font-size: clamp(10px, 1.7vmin, 13px); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }

  .t-tempo { grid-area: tempo; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
  .big { display: flex; align-items: baseline; gap: .12em; line-height: .9; font-size: clamp(56px, 19vmin, 170px); }
  .big .now { font-weight: 700; color: var(--state); transition: color .4s; letter-spacing: -.03em; }
  .big .of { font-size: .32em; font-weight: 600; color: var(--soft); }
  .cue { font-size: clamp(14px, 2.8vmin, 22px); font-weight: 600; color: var(--state); transition: color .4s; }

  .t-ritme { grid-area: ritme; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-height: 90px; }
  .t-ritme canvas { width: 100%; height: 100%; display: block; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .t-doel { grid-area: doel; }
  .t-metro { grid-area: metro; }
  .stepper { display: flex; align-items: center; gap: clamp(8px, 1.6vmin, 14px); }
  .stepper .v { font-size: clamp(20px, 3.6vmin, 30px); font-weight: 700; min-width: 2ch; text-align: center; }
  .pm { width: clamp(38px, 6.4vmin, 52px); height: clamp(38px, 6.4vmin, 52px); border-radius: 50%; background: var(--raise); display: grid; place-items: center; }
  .pm svg { width: 40%; height: 40%; }
  .pm:active, .ib:active, .chip:active { filter: brightness(1.4); }

  .switch { width: 54px; height: 32px; border-radius: 16px; background: #3a4049; position: relative; transition: background .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--ok); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }

  .stat { display: flex; flex-direction: column; justify-content: space-between; gap: clamp(8px, 2vmin, 18px); }
  .stat .v { font-size: clamp(20px, 5.4vmin, 44px); font-weight: 650; line-height: 1; white-space: nowrap; }
  .s1 { grid-area: s1; } .s2 { grid-area: s2; } .s3 { grid-area: s3; }

  /* Knoppen bovenin */
  .ib { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--tile); color: var(--muted); display: grid; place-items: center; position: relative; }
  .ib svg { width: 52%; height: 52%; }
  .ib.bt.cta { color: #fff; background: var(--blue); }
  .ib.bt.connected { color: var(--blue); }
  .ib.bt.busy { color: var(--slow); }
  .ib.bt .dot { position: absolute; right: 2px; top: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bg); display: none; }
  .ib.bt.connected .dot { display: block; }
  .chip { flex: none; height: 38px; padding: 0 14px; border-radius: 999px; background: var(--tile); color: var(--soft);
    font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .chip svg { width: 18px; height: 18px; }
  .chip.on { color: var(--ok); background: rgba(48, 209, 88, .14); }

  .pipwrap { position: fixed; inset: 0; z-index: 10; background: rgba(11, 13, 16, .94); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .pipwrap.show { opacity: 1; pointer-events: auto; }
  .pipwrap p { margin: 0; font-size: 15px; color: var(--text); }
  .pipwrap video { width: min(92vw, 520px); aspect-ratio: 840 / 96; border-radius: 10px; background: #111418; cursor: pointer; }
  .hint { position: fixed; left: 50%; top: calc(max(12px, env(safe-area-inset-top)) + 50px); transform: translateX(-50%); background: #2a3037; color: var(--text);
    font-size: 13px; padding: 8px 14px; border-radius: 10px; max-width: 92vw; text-align: center; width: max-content;
    opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; }
  .hint.show { opacity: 1; }
</style>
</head>
<body>

<!-- Pictogrammen -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-bt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.8-6.3"/><path d="M3.5 4v4.5H8"/></symbol>
    <symbol id="i-pip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><rect x="11.5" y="12" width="7" height="4.5" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></symbol>
  </defs>
</svg>

<main class="tiles">
  <div class="top">
    <button class="chip" data-act="demo" type="button" aria-pressed="false">Demo</button>
    <button class="ib" data-act="reset" type="button" aria-label="Afstand en tijd op nul zetten" title="Afstand en tijd op nul zetten"><svg><use href="#i-reset"/></svg></button>
    <button class="chip" data-act="pip" type="button" aria-pressed="false"><svg><use href="#i-pip"/></svg>Zwevende balk</button>
    <button class="ib bt cta" data-act="conn" type="button" aria-label="Verbinden met de roeier"><svg><use href="#i-bt"/></svg><span class="dot"></span></button>
  </div>

  <section class="tile t-tempo">
    <div class="lbl">Tempo</div>
    <div class="big num"><span class="now" data-v="spm">--</span><span class="of">/ <span data-v="goal">24</span></span></div>
    <div class="cue" data-v="state">Niet verbonden</div>
  </section>

  <section class="tile t-ritme">
    <div class="lbl">Ritme</div>
    <canvas id="ritme" aria-label="Roeiertje dat de slag voordoet op het doeltempo"></canvas>
  </section>

  <section class="tile t-doel row">
    <div class="lbl">Doel</div>
    <div class="stepper">
      <button class="pm" data-act="minus" type="button" aria-label="Doeltempo lager"><svg><use href="#i-minus"/></svg></button>
      <span class="v num" data-v="goal">24</span>
      <button class="pm" data-act="plus" type="button" aria-label="Doeltempo hoger"><svg><use href="#i-plus"/></svg></button>
    </div>
  </section>

  <section class="tile t-metro row">
    <div class="lbl" id="metroLbl">Metronoom</div>
    <button class="switch" data-act="audio" type="button" role="switch" aria-checked="false" aria-labelledby="metroLbl"></button>
  </section>

  <section class="tile stat s1"><div class="lbl">Meter</div><div class="v num" data-v="dist">0</div></section>
  <section class="tile stat s2"><div class="lbl">Tijd</div><div class="v num" data-v="time">0:00</div></section>
  <section class="tile stat s3"><div class="lbl">Per 500 m</div><div class="v num" data-v="pace">-:--</div></section>
</main>

<div class="hint" id="hint"></div>

<!-- Zwevende balk: wordt op dit canvas getekend en als video in Picture-in-Picture gezet -->
<canvas id="pipCanvas" width="840" height="96" style="position:fixed;left:-9999px;top:0"></canvas>
<div class="pipwrap" id="pipWrap">
  <p>Tik op de balk om hem te laten zweven.</p>
  <video id="pipVideo" muted playsinline autoplay></video>
  <button class="chip" data-act="pipclose" type="button">Annuleren</button>
</div>

<script>
(() => {
  'use strict';

  // ---------- Instellingen ----------
  const SPM_MIN = 10, SPM_MAX = 40;   // bereik van de meter
  const GOAL_MIN = 14, GOAL_MAX = 40;
  const TOLERANCE = 2;                // binnen +/- 2 slagen = op tempo
  const IDLE_AFTER_MS = 6000;         // geen nieuwe slag binnen 6 s = stilstand

  const store = {
    get(k, d) { try { const v = localStorage.getItem('roeitempo.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('roeitempo.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  const $ = id => document.getElementById(id);
  const all = sel => document.querySelectorAll(sel);
  const setText = (key, text) => all(`[data-v="${key}"]`).forEach(n => { if (n.textContent !== text) n.textContent = text; });
  const el = { hint: $('hint'), ritme: $('ritme') };

  // ---------- Toestand ----------
  const s = {
    goal: Math.min(GOAL_MAX, Math.max(GOAL_MIN, store.get('goal', 24))),
    spm: 0,
    lastStrokeAt: 0,
    strokes: null,      // slagenaantal van de roeier
    distance: 0, distanceOffset: null,
    pace: 0,            // seconden per 500 m, 0 = onbekend
    elapsed: 0,         // ms actieve roeitijd
    lastClock: performance.now(),
    source: null,       // 'ble' | 'demo' | null
    audioOn: false
  };

  function status() {
    if (!s.source) return { key: 'idle', text: 'Niet verbonden' };
    if (!s.spm || performance.now() - s.lastStrokeAt > IDLE_AFTER_MS) return { key: 'idle', text: 'Nog geen slagen' };
    const diff = s.spm - s.goal;
    if (Math.abs(diff) <= TOLERANCE) return { key: 'ok', text: 'Op tempo' };
    return diff < 0 ? { key: 'slow', text: 'Sneller' } : { key: 'fast', text: 'Rustiger' };
  }

  const COLORS = { ok: 'var(--ok)', slow: 'var(--slow)', fast: 'var(--fast)', idle: 'var(--idle)' };

  function render() {
    const st = status();
    document.documentElement.style.setProperty('--state', COLORS[st.key]);
    const active = st.key !== 'idle';

    // Teksten in de tegels
    setText('spm', active ? String(Math.round(s.spm)) : '--');
    setText('state', st.text);
    setText('goal', String(s.goal));
    setText('dist', Math.max(0, Math.floor(s.distance - (s.distanceOffset || 0))).toLocaleString('nl-NL'));
    setText('time', fmtTime(s.elapsed / 1000));
    setText('pace', active && s.pace > 0 && s.pace < 600 ? fmtTime(s.pace) : '-:--');
    pip.draw(st, active);
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, ss = String(sec % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  }

  // Klok: telt alleen door zolang er geroeid wordt
  function clock() {
    const now = performance.now();
    if (s.source && s.lastStrokeAt && now - s.lastStrokeAt < IDLE_AFTER_MS) s.elapsed += now - s.lastClock;
    s.lastClock = now;
    render();
  }
  setInterval(clock, 250);

  // Nieuwe meetwaarden (van de roeier of de demo)
  function onData({ spm, strokes, distance, pace }) {
    const now = performance.now();
    if (strokes != null) {
      // Een nieuwe slag herken je aan een hoger slagenaantal, niet aan elk bericht
      if (s.strokes !== null && strokes !== s.strokes) s.lastStrokeAt = now;
      s.strokes = strokes;
    }
    if (spm != null) s.spm = spm;
    if (distance != null) {
      if (s.distanceOffset === null) s.distanceOffset = distance; // begin bij nul, ook als de ESP32 al telde
      if (distance < s.distanceOffset) s.distanceOffset = 0;       // ESP32 opnieuw gestart
      s.distance = distance;
    }
    if (pace != null) s.pace = pace;
    render();
  }

  function resetSession() {
    s.distanceOffset = s.distance;
    s.elapsed = 0;
    if (s.source === 'demo') demo.reset();
    render();
    hint('Afstand en tijd staan weer op nul.');
  }

  function setGoal(v) {
    s.goal = Math.min(GOAL_MAX, Math.max(GOAL_MIN, v));
    store.set('goal', s.goal);
    reanchorBeat();
    metro.retime();
    render();
  }

  // ---------- Ritmeklok (gedeeld door metronoom en ritme-stip) ----------
  const beat = { origin: performance.now(), interval: 60000 / s.goal };
  const beatPhase = (now = performance.now()) => (((now - beat.origin) / beat.interval) % 1 + 1) % 1;
  function reanchorBeat() {
    // Nieuw doeltempo: zelfde plek in de slag houden, alleen sneller of langzamer verder
    const now = performance.now(), ph = beatPhase(now);
    beat.interval = 60000 / s.goal;
    beat.origin = now - ph * beat.interval;
  }
  // Positie van de ritme-stip: snel heen (haal, 1/3 van de slag), rustig terug (herstel, 2/3)
  const DRIVE = 1 / 3;
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const ease = k => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(k));   // versnellen en afremmen
  const lerp = (a, b, k) => a + (b - a) * k;
  // Haal: benen, dan lijf, dan armen. Terug: armen, dan lijf, dan benen.
  function strokeParts(ph) {
    const drive = ph < DRIVE, k = drive ? ph / DRIVE : (ph - DRIVE) / (1 - DRIVE);
    if (drive) return { legs: ease(k / 0.65), body: ease((k - 0.45) / 0.45), arms: ease((k - 0.7) / 0.3) };
    return { arms: 1 - ease(k / 0.25), body: 1 - ease((k - 0.15) / 0.3), legs: 1 - ease((k - 0.35) / 0.65) };
  }

  // Roeiertje dat de slag voordoet, kijkt naar links (daar zit de machine)
function drawRower(g, x, y, w, h, ph) {
    const p = strokeParts(ph), catchNow = ph < 0.06 || ph > 0.985;
    const line = (x0, y0, x1, y1, c, lw) => { g.strokeStyle = c; g.lineWidth = lw; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
    const u = Math.min(h / 1.02, w / 1.9), lw = Math.max(1.5, u * 0.06);
    const x0 = x + Math.max(0, (w - 1.9 * u) / 2), ry = y + h - u * 0.05;
    const fx = x0 + u * 0.24, fy = ry - u * 0.14, handleY = ry - u * 0.40;
    const bend = (ax, ay, bx, by, len, pick) => {   // twee gelijke staven, knik naar de gekozen kant
      const dx = bx - ax, dy = by - ay, d = Math.min(Math.hypot(dx, dy), 2 * len - 0.01) || 0.01;
      const off = Math.sqrt(Math.max(0, len * len - (d / 2) ** 2)), mx = (ax + bx) / 2, my = (ay + by) / 2;
      const p1 = [dy / d, -dx / d], p2 = [-dy / d, dx / d], q = pick(p1) >= pick(p2) ? p1 : p2;
      return [mx + q[0] * off, my + q[1] * off];
    };
    line(x0 + u * 0.12, ry, x0 + 1.9 * u, ry, '#262c34', lw);                           // rail
    line(fx - u * 0.05, ry - u * 0.30, fx + u * 0.01, ry - u * 0.02, '#7d8793', lw);   // voetenplank
    const hipX = lerp(fx + u * 0.27, fx + u * 0.70, p.legs), hipY = ry - u * 0.10;
    const [kx, ky] = bend(fx, fy, hipX, hipY, u * 0.36, q => -q[1]);                   // knie omhoog
    const th = lerp(0.40, -0.35, p.body), T = u * 0.42;                                // voorover naar achterover
    const shX = hipX - Math.sin(th) * T, shY = hipY - Math.cos(th) * T;
    const a = u * 0.21, reach = 2 * a * 0.98;
    const extX = shX - Math.sqrt(Math.max(0, reach * reach - (handleY - shY) ** 2));
    const handX = lerp(extX, hipX - Math.sin(th) * T * 0.55 - u * 0.06, p.arms);       // hendel naar de onderste ribben
    const [ex, ey] = bend(shX, shY, handX, handleY, a, q => q[1] + q[0] * 0.6);       // elleboog naar onder en achter
    line(x0, handleY, handX, handleY, '#262c34', lw * 0.7);                            // ketting naar de machine
    line(fx, fy, kx, ky, '#8a94a1', lw); line(kx, ky, hipX, hipY, '#8a94a1', lw);
    line(hipX, hipY, shX, shY, '#c9ced4', lw * 1.15);
    line(shX, shY, ex, ey, '#c9ced4', lw); line(ex, ey, handX, handleY, '#c9ced4', lw);
    g.fillStyle = '#c9ced4'; g.beginPath(); g.arc(shX - Math.sin(th) * u * 0.13, shY - Math.cos(th) * u * 0.13, u * 0.078, 0, Math.PI * 2); g.fill();
    g.fillStyle = catchNow ? '#30d158' : '#f2f4f6';                                         // groen bij de inzet
    g.beginPath(); g.roundRect ? g.roundRect(hipX - u * 0.10, ry - u * 0.085, u * 0.2, u * 0.055, u * 0.03) : g.rect(hipX - u * 0.10, ry - u * 0.085, u * 0.2, u * 0.055); g.fill();
  }


  // ---------- Metronoom (Web Audio) ----------
  const metro = (() => {
    let ctx = null, timer = null, nextAt = 0;
    const LOOKAHEAD = 0.12;

    function ensure() {
      // Naast andere geluiden (film) spelen in plaats van ze te pauzeren
      try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        ctx = new AC();
      }
      if (ctx.state !== 'running') ctx.resume();
      return true;
    }

    function click(t, off) {
      // Zachte tik; buiten het doel een lagere, iets doffere tik
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = off ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(off ? 520 : 1046, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(off ? 0.22 : 0.28, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (off ? 0.12 : 0.07));
      o.connect(g).connect(ctx.destination);
      o.start(t); o.stop(t + 0.15);
    }

    // Tikken op de gedeelde ritmeklok, zodat tik en ritme-stip samenvallen
    let lastBeat = -1;
    function loop() {
      if (!ctx) return;
      const now = performance.now();
      let k = Math.max(lastBeat + 1, Math.ceil((now - beat.origin) / beat.interval));
      for (;;) {
        const at = beat.origin + k * beat.interval;
        if (at > now + LOOKAHEAD * 1000) break;
        const st = status().key;
        click(ctx.currentTime + Math.max(0.005, (at - now) / 1000), st === 'slow' || st === 'fast');
        lastBeat = k++;
      }
    }

    return {
      start() {
        if (!ensure()) return false;
        lastBeat = Math.floor((performance.now() - beat.origin) / beat.interval);
        clearInterval(timer); timer = setInterval(loop, 25); loop();
        return true;
      },
      stop() { clearInterval(timer); timer = null; },
      retime() { lastBeat = Math.floor((performance.now() - beat.origin) / beat.interval); }
    };
  })();

  function setAudio(on) {
    s.audioOn = on && metro.start();
    if (!s.audioOn) metro.stop();
    all('[data-act="audio"]').forEach(b => b.setAttribute('aria-checked', String(s.audioOn)));
  }

  // ---------- Scherm aan houden ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && s.source) keepAwake(); });

  // ---------- Bluetooth (FTMS, Rower Data 0x2AD1) ----------
  const FTMS = 0x1826, ROWER_DATA = 0x2ad1;
  let device = null, wantConnected = false, retryTimer = null;

  function parseRowerData(dv) {
    let i = 0;
    const flags = dv.getUint16(i, true); i += 2;
    const out = {};
    if (!(flags & 0x0001)) { out.spm = dv.getUint8(i) / 2; out.strokes = dv.getUint16(i + 1, true); i += 3; } // slagtempo (0,5 nauwkeurig) + aantal slagen
    if (flags & 0x0002) i += 1;                                               // gemiddeld slagtempo
    if (flags & 0x0004) { out.distance = dv.getUint16(i, true) | (dv.getUint8(i + 2) << 16); i += 3; }
    if (flags & 0x0008) { out.pace = dv.getUint16(i, true); i += 2; }        // seconden per 500 m
    return out;
  }

  function setConn(state, label) {
    all('[data-act="conn"]').forEach(b => {
      b.classList.toggle('connected', state === 'on');
      b.classList.toggle('busy', state === 'busy');
      b.classList.toggle('cta', state === 'off');
      b.setAttribute('aria-label', label);
      b.title = label;
    });
  }

  async function connectGatt() {
    setConn('busy', 'Bezig met verbinden');
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService(FTMS);
    const ch = await svc.getCharacteristic(ROWER_DATA);
    ch.addEventListener('characteristicvaluechanged', e => { if (s.source === 'ble') onData(parseRowerData(e.target.value)); });
    await ch.startNotifications();
    setConn('on', 'Verbonden met ' + (device.name || 'de roeier'));
    hint('Verbonden met de roeier.');
  }

  function scheduleRetry() {
    clearTimeout(retryTimer);
    if (!wantConnected) return;
    setConn('busy', 'Verbinding kwijt, opnieuw verbinden');
    retryTimer = setTimeout(async () => {
      try { await connectGatt(); } catch (e) { scheduleRetry(); }
    }, 3000);
  }

  async function connect() {
    if (!navigator.bluetooth) {
      hint('Deze browser kan geen Bluetooth. Open deze pagina in Bluefy.');
      return;
    }
    try {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: [FTMS] }] });
      device.addEventListener('gattserverdisconnected', scheduleRetry);
      wantConnected = true;
      stopDemo();
      s.source = 'ble';
      s.distanceOffset = null;
      s.strokes = null;
      await connectGatt();
      keepAwake();
    } catch (e) {
      if (e && e.name === 'NotFoundError') { if (!wantConnected) setConn('off', 'Verbinden met de roeier'); return; }
      if (wantConnected) scheduleRetry();
      else { setConn('off', 'Verbinden met de roeier'); hint('Verbinden lukte niet. Probeer het nog eens.'); }
    }
  }

  function disconnect() {
    wantConnected = false;
    clearTimeout(retryTimer);
    try { if (device && device.gatt.connected) device.gatt.disconnect(); } catch (e) {}
    if (s.source === 'ble') s.source = null;
    setConn('off', 'Verbinden met de roeier');
    render();
  }

  // ---------- Demo ----------
  const demo = (() => {
    let timer = null, t0 = 0, dist = 0, count = 0;
    function stroke() {
      const t = (performance.now() - t0) / 1000;
      // Tempo schommelt rustig rond het doel, met af en toe een uitschieter
      const spm = Math.max(14, Math.min(38, s.goal + 3.2 * Math.sin(t / 9) + 1.6 * Math.sin(t / 3.1) + (Math.random() - .5)));
      const pace = Math.max(95, 150 - (spm - 20) * 2.2 + (Math.random() - .5) * 4); // s per 500 m
      const interval = 60 / spm;
      dist += 500 / pace * interval;
      onData({ spm: Math.round(spm * 2) / 2, strokes: ++count, distance: dist, pace: Math.round(pace) });
      timer = setTimeout(stroke, interval * 1000);
    }
    return {
      start() { t0 = performance.now(); dist = 0; count = 0; s.strokes = 0; s.distanceOffset = 0; s.distance = 0; s.elapsed = 0; stroke(); },
      stop() { clearTimeout(timer); timer = null; },
      reset() { dist = 0; s.distance = 0; s.distanceOffset = 0; }
    };
  })();

  function setDemoButtons(on) {
    all('[data-act="demo"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  }

  function stopDemo() {
    demo.stop();
    setDemoButtons(false);
    if (s.source === 'demo') { s.source = null; s.spm = 0; }
  }

  function toggleDemo() {
    if (s.source === 'demo') { stopDemo(); render(); return; }
    if (wantConnected) { hint('Verbreek eerst de verbinding met de roeier.'); return; }
    s.source = 'demo';
    setDemoButtons(true);
    demo.start();
    keepAwake();
    hint('Demo: er komen nagebootste slagen binnen.');
  }

  // ---------- Zwevende balk (Picture-in-Picture van een canvas) ----------
  const pip = (() => {
    const cv = document.getElementById('pipCanvas'), vid = document.getElementById('pipVideo');
    const g = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    const FONT = '-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
    const HEX = { ok: '#30d158', slow: '#ff9f0a', fast: '#ff453a', idle: '#4a525c' };
    let ready = false, tickFlip = false;

    // De balk: 420 x 48 punten, getekend op dubbele resolutie
    function draw(st, active) {
      if (!g) return;
      lastArgs = [st, active];
      g.setTransform(2, 0, 0, 2, 0, 0);
      const BW = W / 2, BH = H / 2, col = HEX[st.key];
      g.fillStyle = '#111418'; g.fillRect(0, 0, BW, BH);
      g.textBaseline = 'alphabetic';

      // Links: tempo nu (kleur = op tempo, te langzaam of te snel) en het doel
      let x = 14;
      g.font = `700 24px ${FONT}`; g.fillStyle = active ? col : '#5d6773';
      const now = active ? String(Math.round(s.spm)) : '--';
      g.fillText(now, x, 33); x += g.measureText(now).width + 3;
      g.font = `600 13px ${FONT}`; g.fillStyle = '#c9ced4';
      g.fillText('/ ' + s.goal, x, 33);

      // Midden: het roeiertje
      drawRower(g, 104, 4, 170, 40, beatPhase());

      // Rechts: afstand en tijd
      g.textAlign = 'right';
      const t = fmtTime(s.elapsed / 1000);
      g.font = `500 12px ${FONT}`; g.fillStyle = '#8a94a1';
      g.fillText(t, BW - 14, 31);
      const tw = g.measureText(t).width;
      g.font = `650 15px ${FONT}`; g.fillStyle = '#f2f4f6';
      g.fillText(Math.max(0, Math.floor(s.distance - (s.distanceOffset || 0))).toLocaleString('nl-NL') + ' m', BW - 14 - tw - 8, 31);
      g.textAlign = 'left';
      g.setTransform(1, 0, 0, 1, 0, 0);

      tickFlip = !tickFlip; g.fillStyle = tickFlip ? '#111418' : '#121519'; g.fillRect(0, H - 1, 1, 1);
    }

    function setup() {
      if (ready) return true;
      if (!cv.captureStream) return false;
      vid.srcObject = cv.captureStream(20);
      vid.play().catch(() => {});
      ready = true;
      return true;
    }

    function isOn() {
      return document.pictureInPictureElement === vid || vid.webkitPresentationMode === 'picture-in-picture';
    }

    function setButtons() {
      const on = isOn();
      all('[data-act="pip"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    }
    vid.addEventListener('enterpictureinpicture', setButtons);
    vid.addEventListener('leavepictureinpicture', setButtons);
    vid.addEventListener('webkitpresentationmodechanged', setButtons);

    let pending = false;
    const info = () => `(technisch: rs=${vid.readyState} b=${vid.videoWidth} p=${vid.paused ? 1 : 0} api=${vid.webkitSetPresentationMode ? 'wk' : ''}${vid.requestPictureInPicture ? 'std' : ''})`;

    function checkLater() {
      setTimeout(() => {
        pending = false;
        setButtons();
        if (isOn()) close();
        else hint('De zwevende balk kwam niet op gang ' + info());
      }, 2500);
    }

    const wrap = document.getElementById('pipWrap');
    const close = () => wrap.classList.remove('show');

    // Knop: eerst de balk zichtbaar tonen; iPadOS laat het zwevende venster uit een zichtbare video groeien
    function toggle() {
      if (!setup()) { hint('Deze browser kan geen zwevende balk maken.'); return; }
      if (isOn()) {
        if (vid.webkitSetPresentationMode) vid.webkitSetPresentationMode('inline');
        else if (document.exitPictureInPicture) document.exitPictureInPicture();
        return;
      }
      if (vid.paused) vid.play().catch(() => {});
      wrap.classList.add('show');
    }

    // Tik op de zichtbare balk: nu echt laten zweven
    function start() {
      if (pending) { hint('De zwevende balk wordt nog gestart, even geduld.'); return; }
      try {
        if (vid.paused) vid.play().catch(() => {});
        if (vid.readyState < 1) { hint('De balk is nog niet klaar. Probeer het over een paar tellen opnieuw ' + info()); return; }
        pending = true;
        if (vid.webkitSupportsPresentationMode && vid.webkitSupportsPresentationMode('picture-in-picture')) {
          vid.webkitSetPresentationMode('picture-in-picture');
          checkLater();
        } else if (vid.requestPictureInPicture) {
          vid.requestPictureInPicture()
            .then(() => { pending = false; setButtons(); close(); })
            .catch(e => { pending = false; hint('Zwevende balk lukte niet: ' + (e && e.message ? e.message : 'onbekende fout') + ' ' + info()); });
        } else {
          pending = false;
          hint('Deze browser kan geen zwevende balk maken.');
        }
      } catch (e) { pending = false; hint('Zwevende balk lukte niet: ' + e.message + ' ' + info()); }
    }
    vid.addEventListener('click', start);

    // Alvast klaarzetten, zodat de knop direct kan starten
    setup();
    let lastArgs = null;
    setInterval(() => { if (lastArgs && isOn()) draw(...lastArgs); }, 50);
    return { draw, toggle, close };
  })();

  // ---------- Ritme-tegel: roeiertje op het doeltempo ----------
  (() => {
    const cv = el.ritme, g = cv.getContext('2d');
    let w = 0, h = 0;
    const fit = () => {
      const r = cv.getBoundingClientRect(), k = window.devicePixelRatio || 1;
      w = r.width; h = r.height;
      cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
      g.setTransform(k, 0, 0, k, 0, 0);
    };
    if (window.ResizeObserver) new ResizeObserver(fit).observe(cv); else window.addEventListener('resize', fit);
    fit();
    const frame = () => {
      if (document.visibilityState === 'visible' && w > 0 && h > 0) {
        g.clearRect(0, 0, w, h);
        const bh = Math.min(h, w / 1.9, 200);   // niet groter dan nodig
        drawRower(g, 0, (h - bh) / 2, w, bh, beatPhase());
      }
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  })();

  // ---------- Knoppen ----------
  const actions = {
    minus: () => setGoal(s.goal - 1),
    plus: () => setGoal(s.goal + 1),
    reset: resetSession,
    audio: () => setAudio(!s.audioOn),
    demo: toggleDemo,
    pip: () => pip.toggle(),
    pipclose: () => pip.close(),
    conn: () => { if (wantConnected) { if (confirm('Verbinding met de roeier verbreken?')) disconnect(); } else connect(); }
  };
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (b && actions[b.dataset.act]) actions[b.dataset.act]();
  });

  // ---------- Melding ----------
  let hintTimer = null;
  function hint(text) {
    el.hint.textContent = text;
    el.hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => el.hint.classList.remove('show'), text.length > 70 ? 9000 : 3200);
  }

  setAudio(false);
  setConn('off', 'Verbinden met de roeier');
  render();
})();
</script>
</body>
</html>
